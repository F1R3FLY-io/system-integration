# Observer config for joining a standalone-dev network.
# Overrides only the network-id (both server and client) so the observer
# matches the baseline's "standalone-dev" network without becoming standalone.

protocol-server {
  network-id = "standalone-dev"
  allow-private-addresses = true
  no-upnp = true
}

protocol-client {
  network-id = "standalone-dev"
}

casper {
  fault-tolerance-threshold = 0.1
  enable-mergeable-channel-gc = true
}
