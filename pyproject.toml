[tool.poetry]
name = "shardctl"
version = "0.1.0"
description = "A CLI tool for managing microservices with docker-compose"
authors = ["Pyrofex <dev@pyrofex.net>"]
readme = "README.md"
packages = [{ include = "shardctl" }]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.9.0"
rich = "^13.0.0"
pyyaml = "^6.0"
setuptools = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
ruff = "^0.1.0"

[tool.poetry.group.integration.dependencies]
docker = "*"
pytest-json = "*"
pytest-xdist = "*"
typing-extensions = "*"
urllib3 = ">=1.24.2"
ecdsa = "*"
eth-hash = { version = "*", extras = ["pycryptodome"] }
pycryptodome = "*"
pyf1r3fly = { git = "https://github.com/F1R3FLY-io/pyf1r3fly.git" }
requests = "*"
pytest-timeout = "^2.4.0"

[tool.poetry.scripts]
shardctl = "shardctl.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "info"
log_cli_format = "%(message)s"
log_file = "integration-tests/integration-tests.log"
log_file_level = "debug"
log_file_format = "%(message)s"
json_report = "integration-tests/report.json"
jsonapi = "anything"
testpaths = ["integration-tests/test"]
# Parallel execution: use "pytest -n 3 --dist=loadgroup" to run 3 workers,
# one per infrastructure group (shard, standalone, custom). Each test is
# tagged with @pytest.mark.xdist_group() so all tests sharing the same
# Docker environment run on the same worker.
# NOTE: test_consensus_health.py MUST remain the last shard test -- it
# scans shard logs from ALL preceding shard tests. It is placed just before
# the custom tests so the shard can be torn down (by the
# pytest_runtest_teardown hook in conftest.py) before the resource-heavy
# custom shard tests begin.
python_files = [
	"test_web_api.py",
	"test_wallets.py",
	"test_heartbeat.py",
	"test_deployment.py",
	"test_storage.py",
	"test_genesis_ceremony.py",
	"test_internal.py",
	"test_dag_correctness.py",
	"test_finalization.py",
	"test_propose.py",
	"test_replay_determinism.py",
	"test_consensus_health.py",
	"test_synchrony_constraint.py",
	"test_asymmetric_bonds.py",
	"test_bonding_validators.py",
	"test_trim_state.py",
	"test_shard_degradation.py",
]
markers = [
	"xdist_group: assign test to an xdist load group (shard, standalone, custom)",
]
# Per-test timeout (seconds). Includes fixture setup time, so session-scoped
# fixtures (shard startup: compose up + 5 containers reaching Running state)
# must fit within this budget alongside the test body.
# Individual tests can override with @pytest.mark.timeout(N).
# CI overrides this with --timeout=600 to accommodate slower runners.
timeout = 300

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
