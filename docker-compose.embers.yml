services:
  # Embers API - HTTP service that bridges f1r3sky to f1r3node blockchain
  embers:
    image: f1r3flyindustries/embers:latest
    container_name: embers
    ports:
      - "8080:3000"  # Expose on 8080 externally, runs on 3000 internally
    env_file:
      - .env.embers
    environment:
      EMBERS__MAINNET__DEPLOY_SERVICE_URL: ${EMBERS__MAINNET__DEPLOY_SERVICE_URL:-http://rnode.validator1:40401}
      EMBERS__MAINNET__PROPOSE_SERVICE_URL: ${EMBERS__MAINNET__PROPOSE_SERVICE_URL:-http://rnode.validator1:40402}
      EMBERS__MAINNET__OBSERVER_URL: ${EMBERS__MAINNET__OBSERVER_URL:-http://rnode.readonly:40403}
      EMBERS__MAINNET__OBSERVER_WS_API_URL: ${EMBERS__MAINNET__OBSERVER_WS_API_URL:-ws://rnode.readonly:40403}
      EMBERS__MAINNET__VALIDATOR_WS_API_URL: ${EMBERS__MAINNET__VALIDATOR_WS_API_URL:-ws://rnode.validator1:40403}
      EMBERS__MAINNET__SERVICE_KEY: ${EMBERS__MAINNET__SERVICE_KEY:-232DADA5BBAFC0799D5F370DA04AF70CE438F69F954512B26D6FB5B560B81DFE}
      EMBERS__TESTNET__DEPLOY_SERVICE_URL: ${EMBERS__TESTNET__DEPLOY_SERVICE_URL:-http://rnode.validator1:40401}
      EMBERS__TESTNET__PROPOSE_SERVICE_URL: ${EMBERS__TESTNET__PROPOSE_SERVICE_URL:-http://rnode.validator1:40402}
      EMBERS__TESTNET__OBSERVER_URL: ${EMBERS__TESTNET__OBSERVER_URL:-http://rnode.readonly:40403}
      EMBERS__TESTNET__OBSERVER_WS_API_URL: ${EMBERS__TESTNET__OBSERVER_WS_API_URL:-ws://rnode.readonly:40403}
      EMBERS__TESTNET__VALIDATOR_WS_API_URL: ${EMBERS__TESTNET__VALIDATOR_WS_API_URL:-ws://rnode.validator1:40403}
      EMBERS__TESTNET__SERVICE_KEY: ${EMBERS__TESTNET__SERVICE_KEY:-232DADA5BBAFC0799D5F370DA04AF70CE438F69F954512B26D6FB5B560B81DFE}
    networks:
      - f1r3fly
    restart: on-failure:5
    healthcheck:
      test: ["CMD-SHELL", "cat < /dev/tcp/localhost/3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Embers Frontend - React 19 web UI (requires ~/.npmrc with GitHub token)
  embers-frontend:
    build:
      context: ./services/embers-frontend
      dockerfile: apps/embers/Dockerfile
      secrets:
        - npmrc
    image: f1r3flyindustries/embers-frontend:latest
    container_name: embers-frontend
    ports:
      - "5173:80"  # Frontend UI on port 5173
    environment:
      # Browser-side URL: must be accessible from the user's browser (host-published port)
      API_URL: "http://localhost:8080"
    depends_on:
      - embers
    networks:
      - f1r3fly
    restart: unless-stopped

secrets:
  npmrc:
    file: ~/.npmrc

networks:
  f1r3fly:
    name: f1r3fly
    external: true
