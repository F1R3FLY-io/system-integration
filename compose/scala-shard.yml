# =================================================================
# F1R3FLY SCALA NODE - SHARD DOCKER COMPOSE
# =================================================================
# Runs a multi-node shard with bootstrap + 3 validators + observer.
#
# Usage:
#   ./run.sh --scala --shard
#
# Or directly:
#   docker-compose -f compose/scala-shard.yml up -d
#
# NOTE: For Rust nodes, use rust-shard.yml instead.
#
# Port Mapping:
#   Bootstrap:   40400-40405
#   Validator1:  40410-40415
#   Validator2:  40420-40425
#   Validator3:  40430-40435
#   Observer:    40450-40455

x-rnode: &default-rnode
  image: f1r3flyindustries/f1r3fly-scala-node
  user: root
  restart: always
  networks:
    - f1r3fly-shard
  environment:
    - OPENAI_ENABLED=${OPENAI_ENABLED:-false}
    - OPENAI_SCALA_CLIENT_API_KEY=${OPENAI_SCALA_CLIENT_API_KEY:-}

services:
  # =================================================================
  # BOOTSTRAP NODE (Ceremony Master)
  # =================================================================
  # The bootstrap node coordinates genesis ceremony but is NOT a validator.
  # It does not propose blocks or participate in consensus.
  boot:
    <<: *default-rnode
    container_name: ${BOOTSTRAP_HOST:-rnode.bootstrap}
    command:
      # Scala-specific: -D flag is ignored by Rust node
      - -Dlogback.configurationFile=/var/lib/rnode/logback.xml
      - run
      - --host=${BOOTSTRAP_HOST:-rnode.bootstrap}
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --allow-private-addresses
      - --validator-private-key=${BOOTSTRAP_PRIVATE_KEY:-aea5f89c15f880f1aaeb6e8f0f24acef4a5c00b55b7cebea3baee6f2cf56f42d}
    ports:
      - "40400:40400"
      - "40401:40401"
      - "40402:40402"
      - "40403:40403"
      - "40404:40404"
      - "40405:40405"
    volumes:
      # Bootstrap-specific configuration (ceremony master, heartbeat disabled)
      - ./conf/bootstrap-ceremony.conf:/var/lib/rnode/rnode.conf
      - ./genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ./genesis/bonds.txt:/var/lib/rnode/genesis/bonds.txt
      - ./conf/logback.xml:/var/lib/rnode/logback.xml
      # Node-specific volumes
      - ./data/${BOOTSTRAP_HOST:-rnode.bootstrap}:/var/lib/rnode/
      - ./certs/bootstrap/node.certificate.pem:/var/lib/rnode/node.certificate.pem:ro
      - ./certs/bootstrap/node.key.pem:/var/lib/rnode/node.key.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =================================================================
  # VALIDATOR 1
  # =================================================================
  validator1:
    <<: *default-rnode
    container_name: ${VALIDATOR1_HOST:-rnode.validator1}
    depends_on:
      - boot
    command:
      - -Dlogback.configurationFile=/var/lib/rnode/logback.xml
      - run
      - --host=${VALIDATOR1_HOST:-rnode.validator1}
      - --allow-private-addresses
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --validator-public-key=${VALIDATOR1_PUBLIC_KEY}
      - --validator-private-key=${VALIDATOR1_PRIVATE_KEY}
      - --genesis-validator
    ports:
      - "40410:40400"
      - "40411:40401"
      - "40412:40402"
      - "40413:40403"
      - "40414:40404"
      - "40415:40405"
    volumes:
      - ./conf/shared-rnode.conf:/var/lib/rnode/rnode.conf
      - ./genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ./genesis/bonds.txt:/var/lib/rnode/genesis/bonds.txt
      - ./conf/logback.xml:/var/lib/rnode/logback.xml
      - ./data/${VALIDATOR1_HOST:-rnode.validator1}:/var/lib/rnode/
      - ./certs/validator1/node.certificate.pem:/var/lib/rnode/node.certificate.pem:ro
      - ./certs/validator1/node.key.pem:/var/lib/rnode/node.key.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # =================================================================
  # VALIDATOR 2
  # =================================================================
  validator2:
    <<: *default-rnode
    container_name: ${VALIDATOR2_HOST:-rnode.validator2}
    depends_on:
      - boot
    command:
      - -Dlogback.configurationFile=/var/lib/rnode/logback.xml
      - run
      - --host=${VALIDATOR2_HOST:-rnode.validator2}
      - --allow-private-addresses
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --validator-public-key=${VALIDATOR2_PUBLIC_KEY}
      - --validator-private-key=${VALIDATOR2_PRIVATE_KEY}
      - --genesis-validator
    ports:
      - "40420:40400"
      - "40421:40401"
      - "40422:40402"
      - "40423:40403"
      - "40424:40404"
      - "40425:40405"
    volumes:
      - ./conf/shared-rnode.conf:/var/lib/rnode/rnode.conf
      - ./genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ./genesis/bonds.txt:/var/lib/rnode/genesis/bonds.txt
      - ./conf/logback.xml:/var/lib/rnode/logback.xml
      - ./data/${VALIDATOR2_HOST:-rnode.validator2}:/var/lib/rnode/
      - ./certs/validator2/node.certificate.pem:/var/lib/rnode/node.certificate.pem:ro
      - ./certs/validator2/node.key.pem:/var/lib/rnode/node.key.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # =================================================================
  # VALIDATOR 3
  # =================================================================
  validator3:
    <<: *default-rnode
    container_name: ${VALIDATOR3_HOST:-rnode.validator3}
    depends_on:
      - boot
    command:
      - -Dlogback.configurationFile=/var/lib/rnode/logback.xml
      - run
      - --host=${VALIDATOR3_HOST:-rnode.validator3}
      - --allow-private-addresses
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --validator-public-key=${VALIDATOR3_PUBLIC_KEY}
      - --validator-private-key=${VALIDATOR3_PRIVATE_KEY}
      - --genesis-validator
    ports:
      - "40430:40400"
      - "40431:40401"
      - "40432:40402"
      - "40433:40403"
      - "40434:40404"
      - "40435:40405"
    volumes:
      - ./conf/shared-rnode.conf:/var/lib/rnode/rnode.conf
      - ./genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ./genesis/bonds.txt:/var/lib/rnode/genesis/bonds.txt
      - ./conf/logback.xml:/var/lib/rnode/logback.xml
      - ./data/${VALIDATOR3_HOST:-rnode.validator3}:/var/lib/rnode/
      - ./certs/validator3/node.certificate.pem:/var/lib/rnode/node.certificate.pem:ro
      - ./certs/validator3/node.key.pem:/var/lib/rnode/node.key.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # =================================================================
  # OBSERVER (Read-Only Node)
  # =================================================================
  # Observer syncs from validators but does not participate in consensus.
  readonly:
    <<: *default-rnode
    container_name: ${READONLY_HOST:-rnode.readonly}
    depends_on:
      - boot
    command:
      - -Dlogback.configurationFile=/var/lib/rnode/logback.xml
      - run
      - --host=${READONLY_HOST:-rnode.readonly}
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --no-upnp
      - --allow-private-addresses
    ports:
      - "40450:40400"
      - "40451:40401"
      - "40452:40402"
      - "40453:40403"
      - "40454:40404"
      - "40455:40405"
    volumes:
      - ./conf/observer.conf:/var/lib/rnode/rnode.conf
      - ./conf/logback.xml:/var/lib/rnode/logback.xml
      - ./genesis/bonds.txt:/var/lib/rnode/genesis/bonds.txt
      - ./genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ./data/${READONLY_HOST:-rnode.readonly}:/var/lib/rnode/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  f1r3fly-shard:
    driver: bridge
