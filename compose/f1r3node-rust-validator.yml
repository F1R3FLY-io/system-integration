# =================================================================
# F1R3FLY RUST NODE - VALIDATOR, one node per host
# =================================================================
# One validator per instance. Used for all three, which differ only in the key
# pair this host holds.
#
#   docker compose --env-file ../.env.shard -f compose/f1r3node-rust-validator.yml up -d
#
# VALIDATOR_PUBLIC_KEY must match an entry in $GENESIS_DIR/bonds.txt or this
# node will not be in the bond set. Start only after the boot host is up and
# BOOTSTRAP_NODE_ID is known.
#
# No TLS certificate mount: the node generates its identity into its volume on
# first start.
#
# Roles are separate files because compose interpolates every service in a
# file, so a combined file would demand the ceremony key this host must not
# hold.

name: f1r3fly-rust-validator

services:
  validator:
    image: ${F1R3FLY_NODE_IMAGE:?F1R3FLY_NODE_IMAGE must be set - compose resolves :latest silently otherwise}
    user: root
    restart: always
    container_name: rnode.validator
    command:
      - run
      - --host=${NODE_HOST:?NODE_HOST must be the address the other instances dial}
      - --network-id=${SHARD_NETWORK_ID:?SHARD_NETWORK_ID must be set - it must match the rest of the shard exactly}
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:?BOOTSTRAP_NODE_ID must be set - read it from the boot host's /api/status address}@${BOOTSTRAP_HOST:?BOOTSTRAP_HOST must be set}?protocol=40400&discovery=40404
      - --validator-public-key=${VALIDATOR_PUBLIC_KEY:?VALIDATOR_PUBLIC_KEY must be set and must match a bonds.txt entry}
      - --validator-private-key=${VALIDATOR_PRIVATE_KEY:?VALIDATOR_PRIVATE_KEY must be set}
      - --genesis-validator
    ports:
      - "40400:40400"
      - "40401:40401"
      # Privileged gRPC (propose, validator operations) - loopback only.
      - "127.0.0.1:40402:40402"
      - "40403:40403"
      - "40404:40404"
      # Admin HTTP (block-store inspection, internal diagnostics) - loopback only.
      - "127.0.0.1:40405:40405"
    volumes:
      - validator-data:/var/lib/rnode
      - ../conf/shard.conf:/var/lib/rnode/rnode.conf:z
      - ${GENESIS_DIR:?GENESIS_DIR must be set - ../genesis is the test shard and its bonds.txt names committed keys}/wallets.txt:/var/lib/rnode/genesis/wallets.txt:z
      - ${GENESIS_DIR:?GENESIS_DIR must be set}/bonds.txt:/var/lib/rnode/genesis/bonds.txt:z
    environment:
      - OPENAI_ENABLED=${OPENAI_ENABLED:-false}
      # Passed only when set. Setting it overrides conf/shard.conf's filter.
      - RUST_LOG
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "3"
    # Container liveness only. This does NOT detect finalization failure: the
    # previous shard reported healthy for four days with every LFB frozen.
    # scripts/shard-monitor.sh is what asserts the chain advances.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  validator-data:
