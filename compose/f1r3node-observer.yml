# =================================================================
# F1R3FLY SCALA NODE - OBSERVER DOCKER COMPOSE
# =================================================================
# Runs a read-only observer node that syncs from validators.
#
# Usage:
#   docker-compose -f compose/f1r3node-observer.yml up -d
#
# PREREQUISITES:
#   - A running shard network to connect to
#   - Must use the same network as the shard (shared-docker-config_f1r3fly-shard)
#
# NOTE: For Rust nodes, use f1r3node-rust-observer.yml instead.

services:
  observer:
    image: f1r3flyindustries/f1r3fly-scala-node
    user: root
    restart: always
    networks:
      - f1r3fly-shard
    container_name: ${READONLY_HOST:-rnode.readonly}
    command:
      - -Dlogback.configurationFile=/var/lib/rnode/logback.xml
      - run
      - --host=${READONLY_HOST:-rnode.readonly}
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --no-upnp
      - --allow-private-addresses
    ports:
      - "40450:40400"
      - "40451:40401"
      - "40452:40402"
      - "40453:40403"
      - "40454:40404"
      - "40455:40405"
    volumes:
      - observer-data:/var/lib/rnode
      - ../conf/observer.conf:/var/lib/rnode/rnode.conf
      - ../genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ../genesis/bonds.txt:/var/lib/rnode/genesis/bonds.txt
      - ../conf/logback.xml:/var/lib/rnode/logback.xml
    environment:
      - OPENAI_ENABLED=${OPENAI_ENABLED:-false}
      - OPENAI_SCALA_CLIENT_API_KEY=${OPENAI_SCALA_CLIENT_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  observer-data:

networks:
  f1r3fly-shard:
    external: true
    name: shared-docker-config_f1r3fly-shard
