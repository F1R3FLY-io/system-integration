# =================================================================
# F1R3FLY RUST NODE - OBSERVER DOCKER COMPOSE
# =================================================================
# Runs a read-only observer node that syncs from validators.
#
# Usage:
#   docker compose --env-file ../.env.node -f compose/f1r3node-rust-observer.yml up -d
#
# PREREQUISITES:
#   - A running shard network to connect to (f1r3fly network)
#
# NOTE: For Scala nodes, use f1r3node-observer.yml instead.

name: f1r3fly-rust-observer

services:
  observer:
    image: ${F1R3FLY_NODE_IMAGE:-f1r3flyindustries/f1r3fly-rust-node:latest}
    user: root
    restart: always
    networks:
      - f1r3fly
    container_name: ${READONLY_HOST:-rnode.readonly}
    command:
      - run
      - --host=${READONLY_HOST:-rnode.readonly}
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --no-upnp
      - --allow-private-addresses
      - --heartbeat-disabled
    ports:
      - "40450:40400"
      - "40451:40401"
      - "40452:40402"
      - "40453:40403"
      - "40454:40404"
      - "40455:40405"
    volumes:
      - observer-data:/var/lib/rnode
      - ../conf/rust.conf:/var/lib/rnode/rnode.conf
      - ../genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ../genesis/bonds.txt:/var/lib/rnode/genesis/bonds.txt
    environment:
      - OPENAI_ENABLED=${OPENAI_ENABLED:-false}
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  observer-data:

networks:
  f1r3fly:
    external: true
    name: f1r3fly
