# =================================================================
# F1R3FLY RUST NODE - LIGHT SHARD DOCKER COMPOSE
# =================================================================
# Runs a minimal shard with bootstrap + 2 validators (no observer).
# Roughly half the memory of the full 6-node shard, so a developer
# machine can run a real multi-validator shard rather than a standalone.
#
# Ported from the retired Scala compose/f1r3node-shard-light.yml when this
# repo went Rust-only. Semantics are preserved deliberately: same two
# validators, same ports, same genesis (shard-light-bonds.txt), same
# --required-signatures. Only the runtime changed.
#
# Usage:
#   poetry run shardctl up f1r3node-rust-shard-light
#
# Or directly:
#   docker compose --env-file ../.env.node -f compose/f1r3node-rust-shard-light.yml up -d
#
# Port Mapping (identical to the full Rust shard's first three nodes, so the
# two cannot run at the same time — that was true of the Scala pair as well):
#   Bootstrap:   40400-40405
#   Validator1:  40410-40415
#   Validator2:  40420-40425

name: f1r3fly-rust-light

x-rnode: &default-rnode
  image: ${F1R3FLY_NODE_IMAGE:-f1r3flyindustries/f1r3fly-rust:latest}
  user: root
  restart: always
  networks:
    - f1r3fly
  labels:
    f1r3fly.topology: shard-light
  environment:
    - OPENAI_ENABLED=${OPENAI_ENABLED:-false}
    - RUST_LOG=${RUST_LOG:-info}

services:
  # =================================================================
  # BOOTSTRAP NODE (Ceremony Master)
  # =================================================================
  # Coordinates genesis but is NOT a validator (absent from bonds.txt).
  boot:
    <<: *default-rnode
    container_name: ${BOOTSTRAP_HOST:-rnode.bootstrap}
    command:
      - run
      - --host=${BOOTSTRAP_HOST:-rnode.bootstrap}
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --allow-private-addresses
      - --validator-private-key=${BOOTSTRAP_PRIVATE_KEY:-5f668a7ee96d944a4494cc947e4005e172d7ab3461ee5538f1f2a45a835e9657}
      # 1, not the full shard's 2: this topology has two genesis validators
      # rather than three. Carried over unchanged from the Scala light shard —
      # a port should not quietly re-tune consensus parameters.
      - --required-signatures
      - "1"
      - --ceremony-master-mode
      - --heartbeat-disabled
    ports:
      - "40400:40400"
      - "40401:40401"
      - "40402:40402"
      - "40403:40403"
      - "40404:40404"
      - "40405:40405"
    volumes:
      - boot-data:/var/lib/rnode
      - ../conf/rust.conf:/var/lib/rnode/rnode.conf:z
      - ../genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt:z
      - ../genesis/shard-light-bonds.txt:/var/lib/rnode/genesis/bonds.txt:z
      - ../certs/bootstrap/node.certificate.pem:/var/lib/rnode/node.certificate.pem:ro,z
      - ../certs/bootstrap/node.key.pem:/var/lib/rnode/node.key.pem:ro,z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =================================================================
  # VALIDATOR 1
  # =================================================================
  validator1:
    <<: *default-rnode
    container_name: ${VALIDATOR1_HOST:-rnode.validator1}
    depends_on:
      - boot
    command:
      - run
      - --host=${VALIDATOR1_HOST:-rnode.validator1}
      - --allow-private-addresses
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --validator-public-key=${VALIDATOR1_PUBLIC_KEY:-04fa70d7be5eb750e0915c0f6d19e7085d18bb1c22d030feb2a877ca2cd226d04438aa819359c56c720142fbc66e9da03a5ab960a3d8b75363a226b7c800f60420}
      - --validator-private-key=${VALIDATOR1_PRIVATE_KEY:-357cdc4201a5650830e0bc5a03299a30038d9934ba4c7ab73ec164ad82471ff9}
      - --genesis-validator
    ports:
      - "40410:40400"
      - "40411:40401"
      - "40412:40402"
      - "40413:40403"
      - "40414:40404"
      - "40415:40405"
    volumes:
      - validator1-data:/var/lib/rnode
      - ../conf/rust.conf:/var/lib/rnode/rnode.conf:z
      - ../genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt:z
      - ../genesis/shard-light-bonds.txt:/var/lib/rnode/genesis/bonds.txt:z
      - ../certs/validator1/node.certificate.pem:/var/lib/rnode/node.certificate.pem:ro,z
      - ../certs/validator1/node.key.pem:/var/lib/rnode/node.key.pem:ro,z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # =================================================================
  # VALIDATOR 2
  # =================================================================
  validator2:
    <<: *default-rnode
    container_name: ${VALIDATOR2_HOST:-rnode.validator2}
    depends_on:
      - boot
    command:
      - run
      - --host=${VALIDATOR2_HOST:-rnode.validator2}
      - --allow-private-addresses
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --validator-public-key=${VALIDATOR2_PUBLIC_KEY:-04837a4cff833e3157e3135d7b40b8e1f33c6e6b5a4342b9fc784230ca4c4f9d356f258debef56ad4984726d6ab3e7709e1632ef079b4bcd653db00b68b2df065f}
      - --validator-private-key=${VALIDATOR2_PRIVATE_KEY:-2c02138097d019d263c1d5383fcaddb1ba6416a0f4e64e3a617fe3af45b7851d}
      - --genesis-validator
    ports:
      - "40420:40400"
      - "40421:40401"
      - "40422:40402"
      - "40423:40403"
      - "40424:40404"
      - "40425:40405"
    volumes:
      - validator2-data:/var/lib/rnode
      - ../conf/rust.conf:/var/lib/rnode/rnode.conf:z
      - ../genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt:z
      - ../genesis/shard-light-bonds.txt:/var/lib/rnode/genesis/bonds.txt:z
      - ../certs/validator2/node.certificate.pem:/var/lib/rnode/node.certificate.pem:ro,z
      - ../certs/validator2/node.key.pem:/var/lib/rnode/node.key.pem:ro,z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  boot-data:
  validator1-data:
  validator2-data:

networks:
  f1r3fly:
    name: f1r3fly
    driver: bridge
