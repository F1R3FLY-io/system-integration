# =================================================================
# F1R3FLY SCALA NODE - VALIDATOR 4 DOCKER COMPOSE
# =================================================================
# Runs Validator 4 as an additional node to join an existing shard network.
#
# Usage:
#   docker-compose -f f1r3node-validator4.yml up -d
#
# PREREQUISITES:
#   - A running shard network (bootstrap + validators)
#   - Validator 4 must be bonded before it can participate in consensus
#
# See: https://github.com/F1R3FLY-io/rust-client/blob/main/VALIDATOR4_BONDING_GUIDE.md
#
# NOTE: For Rust nodes, use f1r3node-rust-validator4.yml instead.

services:
  validator4:
    image: f1r3flyindustries/f1r3fly-scala-node
    user: root
    restart: always
    networks:
      - f1r3fly-shard
    container_name: ${VALIDATOR4_HOST:-rnode.validator4}
    command:
      - -Dlogback.configurationFile=/var/lib/rnode/logback.xml
      - run
      - --host=${VALIDATOR4_HOST:-rnode.validator4}
      - --allow-private-addresses
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --validator-public-key=${VALIDATOR4_PUBLIC_KEY}
      - --validator-private-key=${VALIDATOR4_PRIVATE_KEY}
    ports:
      - "40440:40400"
      - "40441:40401"
      - "40442:40402"
      - "40443:40403"
      - "40444:40404"
      - "40445:40405"
    volumes:
      - ../conf/shared-rnode.conf:/var/lib/rnode/rnode.conf
      - ../genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ../genesis/bonds.txt:/var/lib/rnode/genesis/bonds.txt
      - ../conf/logback.xml:/var/lib/rnode/logback.xml
      - ../data/${VALIDATOR4_HOST:-rnode.validator4}:/var/lib/rnode/
    environment:
      - OPENAI_ENABLED=${OPENAI_ENABLED:-false}
      - OPENAI_SCALA_CLIENT_API_KEY=${OPENAI_SCALA_CLIENT_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  f1r3fly-shard:
    external: true
    name: compose_f1r3fly-shard
