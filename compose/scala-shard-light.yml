# =================================================================
# F1R3FLY SCALA NODE - LIGHT SHARD DOCKER COMPOSE
# =================================================================
# Runs a minimal shard with bootstrap + 2 validators (no observer).
# Uses ~6 GB RAM instead of ~10+ GB for the full shard.
# Suitable for development and smoke testing on 16 GB machines.
#
# Usage:
#   poetry run shardctl up scala-shard-light
#
# Or directly:
#   docker-compose --env-file ../.env.node -f compose/scala-shard-light.yml up -d
#
# Port Mapping:
#   Bootstrap:   40400-40405
#   Validator1:  40410-40415
#   Validator2:  40420-40425
#   cAdvisor:    8080
#   Prometheus:  9090
#   Grafana:     3000

x-rnode: &default-rnode
  image: f1r3flyindustries/f1r3fly-scala-node
  user: root
  restart: always
  networks:
    - f1r3fly-shard
  labels:
    f1r3fly.topology: shard-light
  environment:
    - JAVA_TOOL_OPTIONS=-Xmx2g
    - OPENAI_ENABLED=${OPENAI_ENABLED:-false}
    - OPENAI_SCALA_CLIENT_API_KEY=${OPENAI_SCALA_CLIENT_API_KEY:-}

services:
  # =================================================================
  # BOOTSTRAP NODE (Ceremony Master)
  # =================================================================
  boot:
    <<: *default-rnode
    container_name: ${BOOTSTRAP_HOST:-rnode.bootstrap}
    command:
      - -Dlogback.configurationFile=/var/lib/rnode/logback.xml
      - run
      - --host=${BOOTSTRAP_HOST:-rnode.bootstrap}
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --allow-private-addresses
      - --validator-private-key=${BOOTSTRAP_PRIVATE_KEY:-aea5f89c15f880f1aaeb6e8f0f24acef4a5c00b55b7cebea3baee6f2cf56f42d}
    ports:
      - "40400:40400"
      - "40401:40401"
      - "40402:40402"
      - "40403:40403"
      - "40404:40404"
      - "40405:40405"
    volumes:
      - ../conf/bootstrap-ceremony-light.conf:/var/lib/rnode/rnode.conf
      - ../genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ../genesis/shard-light-bonds.txt:/var/lib/rnode/genesis/bonds.txt
      - ../conf/logback.xml:/var/lib/rnode/logback.xml
      - ../data/${BOOTSTRAP_HOST:-rnode.bootstrap}:/var/lib/rnode/
      - ../certs/bootstrap/node.certificate.pem:/var/lib/rnode/node.certificate.pem:ro
      - ../certs/bootstrap/node.key.pem:/var/lib/rnode/node.key.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =================================================================
  # VALIDATOR 1
  # =================================================================
  validator1:
    <<: *default-rnode
    container_name: ${VALIDATOR1_HOST:-rnode.validator1}
    depends_on:
      - boot
    command:
      - -Dlogback.configurationFile=/var/lib/rnode/logback.xml
      - run
      - --host=${VALIDATOR1_HOST:-rnode.validator1}
      - --allow-private-addresses
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --validator-public-key=${VALIDATOR1_PUBLIC_KEY}
      - --validator-private-key=${VALIDATOR1_PRIVATE_KEY}
      - --genesis-validator
    ports:
      - "40410:40400"
      - "40411:40401"
      - "40412:40402"
      - "40413:40403"
      - "40414:40404"
      - "40415:40405"
    volumes:
      - ../conf/shared-rnode-light.conf:/var/lib/rnode/rnode.conf
      - ../genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ../genesis/shard-light-bonds.txt:/var/lib/rnode/genesis/bonds.txt
      - ../conf/logback.xml:/var/lib/rnode/logback.xml
      - ../data/${VALIDATOR1_HOST:-rnode.validator1}:/var/lib/rnode/
      - ../certs/validator1/node.certificate.pem:/var/lib/rnode/node.certificate.pem:ro
      - ../certs/validator1/node.key.pem:/var/lib/rnode/node.key.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # =================================================================
  # VALIDATOR 2
  # =================================================================
  validator2:
    <<: *default-rnode
    container_name: ${VALIDATOR2_HOST:-rnode.validator2}
    depends_on:
      - boot
    command:
      - -Dlogback.configurationFile=/var/lib/rnode/logback.xml
      - run
      - --host=${VALIDATOR2_HOST:-rnode.validator2}
      - --allow-private-addresses
      - --bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404
      - --validator-public-key=${VALIDATOR2_PUBLIC_KEY}
      - --validator-private-key=${VALIDATOR2_PRIVATE_KEY}
      - --genesis-validator
    ports:
      - "40420:40400"
      - "40421:40401"
      - "40422:40402"
      - "40423:40403"
      - "40424:40404"
      - "40425:40405"
    volumes:
      - ../conf/shared-rnode-light.conf:/var/lib/rnode/rnode.conf
      - ../genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ../genesis/shard-light-bonds.txt:/var/lib/rnode/genesis/bonds.txt
      - ../conf/logback.xml:/var/lib/rnode/logback.xml
      - ../data/${VALIDATOR2_HOST:-rnode.validator2}:/var/lib/rnode/
      - ../certs/validator2/node.certificate.pem:/var/lib/rnode/node.certificate.pem:ro
      - ../certs/validator2/node.key.pem:/var/lib/rnode/node.key.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # =================================================================
  # MONITORING STACK
  # =================================================================

  # cAdvisor — collects container metrics, feeds Prometheus
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: always
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - f1r3fly-shard

  # Prometheus — scrapes cAdvisor every 15s, stores metrics on disk
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    depends_on:
      - cadvisor
    networks:
      - f1r3fly-shard

  # Grafana — web dashboards, queries Prometheus
  # Default login: admin / admin
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - f1r3fly-shard

volumes:
  prometheus-data:
  grafana-data:

networks:
  f1r3fly-shard:
    driver: bridge
