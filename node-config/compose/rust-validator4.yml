# =================================================================
# F1R3FLY RUST NODE - VALIDATOR 4 DOCKER COMPOSE
# =================================================================
# Runs Validator 4 as an additional node to join an existing shard network.
#
# Usage:
#   docker-compose -f rust-validator4.yml up -d
#
# PREREQUISITES:
#   - A running shard network (bootstrap + validators)
#   - Validator 4 must be bonded before it can participate in consensus
#
# See: https://github.com/F1R3FLY-io/rust-client/blob/main/VALIDATOR4_BONDING_GUIDE.md
#
# NOTE: For Scala nodes, use scala-validator4.yml instead.

services:
  validator4:
    image: f1r3flyindustries/f1r3fly-rust-node:latest
    user: root
    restart: always
    networks:
      - f1r3fly-shard
    container_name: ${VALIDATOR4_HOST:-rnode.validator4}
    command:
      [
        "run",
        "--host=${VALIDATOR4_HOST:-rnode.validator4}",
        "--config-file=/var/lib/rnode/rnode.conf",
        "--data-dir=/var/lib/rnode",
        "--bonds-file=/var/lib/rnode/genesis/bonds.txt",
        "--wallets-file=/var/lib/rnode/genesis/wallets.txt",
        "--bootstrap=rnode://${BOOTSTRAP_NODE_ID:-1e780e5dfbe0a3d9470a2b414f502d59402e09c2}@${BOOTSTRAP_HOST:-rnode.bootstrap}?protocol=40400&discovery=40404",
        "--validator-private-key-path=/var/lib/rnode/validator.key",
        "--allow-private-addresses",
        "--no-upnp",
      ]
    ports:
      - "40440:40400"
      - "40441:40401"
      - "40442:40402"
      - "40443:40403"
      - "40444:40404"
      - "40445:40405"
    volumes:
      - ../conf/shared-rnode.conf:/var/lib/rnode/rnode.conf
      - ../genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ../genesis/bonds.txt:/var/lib/rnode/genesis/bonds.txt
      - ../keys/validator4.key:/var/lib/rnode/validator.key:ro
      - ../data/${VALIDATOR4_HOST:-rnode.validator4}:/var/lib/rnode/
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  f1r3fly-shard:
    external: true
    name: shared-docker-config_f1r3fly-shard
