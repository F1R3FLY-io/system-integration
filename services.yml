# Service repositories configuration
# Map service names to their git repository URLs and build commands
#
# The 'enabled' field controls whether a service is included in operations by default:
#   - enabled: true  (default) - service is cloned/built when using default commands
#   - enabled: false - service is skipped unless explicitly named or --all flag is used
#
# Examples:
#   shardctl clone                                           # Clones only enabled services
#   shardctl clone --include-disabled                        # Clones all services (including disabled)
#   shardctl build-service                                   # Builds all enabled services (source + Docker)
#   shardctl build-service my-disabled-service --docker-only # Builds specific service even if disabled

# Startup order for compose files
# The 'up' command brings up each compose file in order, waiting for each to succeed.
# This ensures dependencies (like networks) are created before dependent services start.
startup_order:
  - f1r3node    # compose/f1r3node.yml - creates the f1r3fly-shard network
  - monitoring  # compose/monitoring.yml - Prometheus + Grafana (joins f1r3fly-shard)
  - embers      # compose/embers.yml - depends on f1r3fly network
  - f1r3sky     # compose/f1r3sky.yml - depends on f1r3fly network

repositories:
  f1r3node:
    url: git@github.com:F1R3FLY-io/f1r3node.git
    branch: dev
  f1r3node-rust:
    url: git@github.com:F1R3FLY-io/f1r3node-rust.git
    branch: staging
  monitoring:
    enabled: true
  rust-client:
    url: git@github.com:F1R3FLY-io/rust-client.git
    branch: dev
  f1r3drive:
    url: git@github.com:F1R3FLY-io/f1r3drive.git
    branch: dev
    enabled: true
  f1r3sky-backend:
    url: git@github.com:F1R3FLY-io/f1r3sky-backend.git
    branch: main
    enabled: false
    builds:
      - f1r3sky-backend-bsky
      - f1r3sky-backend-pds
      - f1r3sky-backend-bsync
      - f1r3sky-backend-ozone
  f1r3sky:
    url: git@github.com:F1R3FLY-io/f1r3sky.git
    branch: main
    enabled: false
  embers:
    url: git@github.com:F1R3FLY-io/firefly-embers.git
    branch: main
    enabled: false
  embers-frontend:
    url: git@github.com:F1R3FLY-io/embers-frontend.git
    branch: main
    enabled: false # Web UI frontend (requires ~/.npmrc with GitHub token)

# Build configuration for services
builds:
  f1r3node:
    # Scala node build configuration
    # Main build command (compiles Scala and stages executable)
    build_command: "sbt stage"

    # Docker build command for Scala node
    docker_build_command: "sbt node/docker:publishLocal"

    # Build environment
    environment: "nix" # Uses nix develop shell

    # Docker image produced
    docker_image: "f1r3flyindustries/f1r3fly-scala-node:latest"

    # Build dependencies
    dependencies:
      - "sbt"
      - "nix (optional but recommended)"

    # Notes:
    # - Scala-based node implementation on chosen branch
    # - Uses SBT (Scala Build Tool) as primary build system
    # - Nix flake provides complete dev environment

  f1r3node-rust:
    # Pure Rust node — standard cargo + system deps (no Nix, no SBT)
    build_command: "cargo build --release -p node"

    # Local Docker build (tags f1r3flyindustries/f1r3fly-rust:local)
    docker_build_command: "./node/docker-commands.sh build-local"

    # Standard cargo build (toolchain auto-installed via rust-toolchain.toml)
    environment: "cargo"

    # Docker image produced (CI publishes :latest, :staging, :dev, :VERSION)
    docker_image: "f1r3flyindustries/f1r3fly-rust:latest"

    # Build dependencies
    dependencies:
      - "rust nightly (pinned via rust-toolchain.toml: nightly-2026-02-09)"
      - "protoc (protobuf-compiler + libprotobuf-dev on Debian/Ubuntu)"
      - "pkg-config"
      - "libssl-dev / openssl"
      - "liblmdb-dev / lmdb"
      - "build-essential / gcc"
      - "just (recommended — used by run-standalone workflow)"

    # Notes:
    # - Standalone Cargo workspace extracted from f1r3node's rust/dev branch
    # - 11 crates: node, casper, rholang, rspace++, models, crypto, comm,
    #   block-storage, shared, graphz, rspace_plus_plus_rhotypes
    # - rust-toolchain.toml auto-installs the correct nightly on first cargo run
    # - Multi-architecture support (AMD64, AARCH64) via Cross.toml

  monitoring:
    enabled: false

  rust-client:
    # Main build command
    build_command: "cargo build --release"

    # No dedicated Docker build (CLI tool that connects to f1r3node)
    docker_build_command: null

    # Binary location after build
    binary_path: "target/release/node_cli"

    # Build dependencies
    dependencies:
      - "cargo"
      - "rustc >= 1.85.0"

    # Notes:
    # - Pure Rust CLI application
    # - Connects to F1R3FLY nodes (typically running in Docker)
    # - No containerization needed - runs locally
    # - Uses f1r3fly-models, f1r3fly-crypto, f1r3fly-rholang dependencies

  f1r3drive:
    # F1r3Drive FUSE application built with Java
    # Main build command
    build_command: "./gradlew shadowJar -x test"

    # No dedicated Docker build (Runs locally natively to mount FUSE)
    docker_build_command: null

    # Build environment
    environment: "nix" # Uses nix develop shell from f1r3drive's flake.nix

    # Native run command (no Docker — runs via existing script)
    # Runs in foreground (FUSE needs process alive). Ctrl-C to stop.
    run_command: "./scripts/run_f1r3drive.sh"

    # Build dependencies
    dependencies:
      - "java >= 17"

    # Notes:
    # - Java FUSE implementation connecting to F1R3FLY Node
    # - Requires MacFUSE or jnr-fuse
    # - Compiled JAR will be output to build/libs/

  f1r3sky-backend-bsky:
    # AT Protocol AppView service (app.bsky.* API endpoints)
    # Main build command
    build_command: "yes | pnpm install --frozen-lockfile && pnpm build"

    # Docker build command for bsky service
    docker_build_command: "docker build --network=host -f services/bsky/Dockerfile -t f1r3flyindustries/f1r3sky-bsky:latest ."

    # Working directory (uses f1r3sky-backend repo for all sub-services)
    working_directory: "f1r3sky-backend"

    # Docker image produced
    docker_image: "f1r3flyindustries/f1r3sky-bsky:latest"

    # Build dependencies
    dependencies:
      - "node >= 18"
      - "pnpm >= 8.15.9"

    # Notes:
    # - TypeScript/Node.js monorepo service
    # - Provides AppView implementation of app.bsky.* APIs
    # - Multi-stage Docker build for optimized image size
    # - Runs on port 3000 by default

  f1r3sky-backend-pds:
    # Personal Data Server (hosts atproto account data)
    # Main build command
    build_command: "yes | pnpm install --frozen-lockfile && pnpm build"

    # Docker build command for pds service
    docker_build_command: "docker build --network=host -f services/pds/Dockerfile -t f1r3flyindustries/f1r3sky-pds:latest ."

    # Working directory (uses f1r3sky-backend repo for all sub-services)
    working_directory: "f1r3sky-backend"

    # Docker image produced
    docker_image: "f1r3flyindustries/f1r3sky-pds:latest"

    # Build dependencies
    dependencies:
      - "node >= 18"
      - "pnpm >= 8.15.9"

    # Notes:
    # - TypeScript/Node.js monorepo service
    # - Hosts repository content for atproto accounts
    # - Core service for AT Protocol implementation
    # - Multi-stage Docker build for optimized image size

  f1r3sky-backend-bsync:
    # Background sync service
    # Main build command
    build_command: "yes |pnpm install --frozen-lockfile && pnpm build"

    # Docker build command for bsync service
    docker_build_command: "docker build --network=host -f services/bsync/Dockerfile -t f1r3flyindustries/f1r3sky-bsync:latest ."

    # Working directory (uses f1r3sky-backend repo for all sub-services)
    working_directory: "f1r3sky-backend"

    # Docker image produced
    docker_image: "f1r3flyindustries/f1r3sky-bsync:latest"

    # Build dependencies
    dependencies:
      - "node >= 18"
      - "pnpm >= 8.15.9"

    # Notes:
    # - TypeScript/Node.js monorepo service
    # - Handles background synchronization tasks
    # - Multi-stage Docker build for optimized image size

  f1r3sky-backend-ozone:
    # Moderation service
    # Main build command
    build_command: "yes | pnpm install --frozen-lockfile && pnpm build"

    # Docker build command for ozone service
    docker_build_command: "docker build --network=host -f services/ozone/Dockerfile -t f1r3flyindustries/f1r3sky-ozone:latest ."

    # Working directory (uses f1r3sky-backend repo for all sub-services)
    working_directory: "f1r3sky-backend"

    # Docker image produced
    docker_image: "f1r3flyindustries/f1r3sky-ozone:latest"

    # Build dependencies
    dependencies:
      - "node >= 18"
      - "pnpm >= 8.15.9"

    # Notes:
    # - TypeScript/Node.js monorepo service
    # - Provides moderation and content filtering capabilities
    # - Multi-stage Docker build for optimized image size

  f1r3sky:
    # F1R3Sky Frontend Web App - React Native/Expo web app with bskyweb Go server
    # Main build command (install dependencies and build web bundle)
    # Requires: .token.classic file with GitHub token (NPM_TOKEN environment variable)
    # We have a little wrapper shell script in system-integration to allow the environment
    # to be configured correctly.
    build_command: "../../firesky_build.sh"

    # Docker build command for f1r3sky web frontend (uses wrapper script for NPM auth)
    docker_build_command: "../../firesky_docker_build.sh"

    # Docker image produced
    docker_image: "f1r3flyindustries/f1r3sky:latest"

    # Build dependencies
    dependencies:
      - "node >= 20"
      - "yarn >= 1.22"
      - "go >= 1.23"

    # Notes:
    # - React Native/Expo web app (Bluesky social app fork)
    # - Builds JavaScript bundle with Expo and serves via bskyweb Go server
    # - Serves on port 8100 by default
    # - Connects to f1r3sky-bsky AppView service (port 2584)
    # - Multi-stage Docker build: Node.js build + Go server

  embers:
    # Embers API - Rust HTTP service that bridges f1r3sky to f1r3node blockchain
    # Main build command (builds Rust workspace)
    build_command: "cargo build --release"

    # Docker build command for embers API service
    docker_build_command: "docker build --network=host -f docker/embers.dockerfile -t f1r3flyindustries/embers:latest ."

    # Docker image produced
    docker_image: "f1r3flyindustries/embers:latest"

    # Build dependencies
    dependencies:
      - "rust >= 1.91"
      - "cargo"
      - "pkg-config"
      - "protobuf-compiler"
      - "clang"

    # Notes:
    # - Rust workspace with multiple packages (embers, events-sync, state-sync, firefly-client)
    # - Provides HTTP API on port 8080 for wallet and agent operations
    # - Connects f1r3sky frontend to f1r3node blockchain
    # - Multi-architecture support (AMD64, AARCH64)
    # - Main binary: packages/embers

  embers-frontend:
    # Embers Frontend - React 19 web UI for Embers platform
    # Main build command (builds client SDK first, then frontend)
    # Requires: ~/.npmrc with GitHub token (//npm.pkg.github.com/:_authToken=TOKEN)
    build_command: "yes | pnpm install --frozen-lockfile && pnpm --filter @f1r3fly-io/embers-client-sdk build && pnpm --filter @f1r3fly-io/embers-frontend build"

    # Docker build command for embers frontend (uses ~/.npmrc)
    docker_build_command: "docker build --network=host -f apps/embers/Dockerfile -t f1r3flyindustries/embers-frontend:latest . --secret id=npmrc,src=$HOME/.npmrc"

    # Docker image produced
    docker_image: "f1r3flyindustries/embers-frontend:latest"

    # Build dependencies
    dependencies:
      - "node >= 24"
      - "pnpm >= 8.15.9"
      - "NPM_TOKEN environment variable (GitHub PAT with read:packages scope)"

    # Notes:
    # - React 19 + TypeScript + Vite monorepo
    # - pnpm workspace: packages/client + apps/embers
    # - Requires GitHub token for @f1r3fly-io/lightning-bug package
    # - Nginx-based static site serving on port 80
    # - Connects to Embers API on port 8080
