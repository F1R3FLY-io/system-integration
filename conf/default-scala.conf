# =================================================================
# F1R3FLY SCALA NODE - DEFAULT CONFIGURATION OVERLAY
# =================================================================
# Includes the shared default.conf (mounted as default-base.conf in
# Scala containers) and disables settings with known Scala bugs.

include "default-base.conf"

casper {
  # Disable mergeable channel GC for Scala nodes.
  # The Scala node has a race condition during genesis that crashes with:
  #   DagState does not contain lastFinalizedBlock
  # The Rust node handles this gracefully.
  # See: https://github.com/F1R3FLY-io/f1r3node/issues/441
  enable-mergeable-channel-gc = false
}
