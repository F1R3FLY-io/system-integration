# =================================================================
# F1R3FLY NODE - OBSERVER (READ-ONLY) CONFIGURATION
# =================================================================
# Inherits all settings from default.conf and overrides only
# heartbeat, which should be disabled for non-validator nodes.
#
# The observer syncs state from validators but does not participate
# in consensus and cannot propose blocks.

include "default.conf"

# Disable heartbeat for non-validator nodes (observer cannot propose).
casper.heartbeat.enabled = false
