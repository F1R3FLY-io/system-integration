# Overrides for a long-lived shard. The node loads its built-in defaults.conf
# first, then this file merges on top. Values equal to the node defaults are
# omitted rather than restated.
#
# The latency set below is conf/rust.conf's verbatim — what test_load passes
# with. Only the logging block differs: rust.conf keeps 2 hours of stdout,
# sized for shards that live 60 seconds rather than weeks.

# At or below heartbeat.check-interval, so one unreachable peer costs a
# proposal round at most one timeout.
protocol-client {
  network-timeout = 3 seconds
}

protocol-server {
  # Required when a node advertises an RFC1918 address: check_host refuses to
  # start otherwise ("Kademlia hostname ... does not resolve to a public IP"),
  # and is_valid_peer rejects peers on private addresses. Set this to false if
  # the instances advertise public IPs — the node default is false precisely so
  # an unreachable advertised address fails loudly at startup.
  allow-private-addresses = true

  no-upnp = true

  # network-id is NOT set here. It is per-deployment, so it is passed as
  # `--network-id`, which overrides both protocol-server.network-id (what this
  # node accepts) and protocol-client.network-id (what it sends).
  #
  # It is the only thing stopping nodes that hold an earlier chain's state from
  # connecting and pushing high-numbered blocks into a fresh shard, so it must
  # differ from every shard that has run before, and every joiner must pass the
  # same value.
}

casper {
  # Finalization needs a clique holding (1+t)/2 = 55% of stake, so 6 of 10
  # equal validators. The node default of 0.67 would require 9 of 10.
  fault-tolerance-threshold = 0.1

  # An aging threshold for entries already received, x6 internally, so 30s
  # against 1440s at the default. Not the re-request interval: unresolved
  # entries re-request on a hard-coded 500ms anchor.
  requested-blocks-timeout = 5 seconds

  # The defaults sit a stalled fork choice out for most of twenty minutes.
  fork-choice-stale-threshold = 1 minutes
  fork-choice-check-if-stale-interval = 20 seconds

  # Cadence drives the per-block floor clock, and finality is about two
  # proposal rounds. Leave stale-recovery-min-interval derived (1.5x) — setting
  # it and later raising check-interval past it is fatal at startup.
  heartbeat {
    check-interval = 3 seconds
    max-lfb-age = 3 seconds
    self-propose-cooldown = 3 seconds
  }

  # Citability window = max-parent-depth x check-interval, and it must cover
  # the node's 58s block re-request span. 25 x 3s = 75s, so the two move
  # together.
  max-parent-depth = 25

  # shard-name deliberately left at the node default `root`. rust-client builds
  # every deploy with shard_id "root" hardcoded (src/grpc/deploy.rs:269, :297)
  # inside the signed projection, with no flag to override it, so any other
  # value here invalidates every client deploy.

  genesis-ceremony {
    # Must be strictly less than the bonded count (approve_block_protocol.rs
    # rejects `bonds.len() <= required_sigs`), so 9 is the ceiling at 10
    # validators. The boot compose file passes --required-signatures too and
    # the flag wins, so the two must agree.
    required-signatures = 9
    approve-interval = 10 seconds
  }

  genesis-block-data {
    # Inert below 10000 bonded validators; carried for parity with rust.conf.
    number-of-active-validators = 10000

    # Each boundary is a PoS closeBlock with payouts. ~15-25 min at
    # 8-15 heights/min.
    epoch-length = 200

    # Five epochs, the shipped ratio — withdrawn stake stays slashable ~1-2h.
    quarantine-length = 1000
  }
}

logging {
  # INFO baseline, the node's own dependency and per-peer-chatter demotions,
  # plus the streams that let a finalization stall be diagnosed without a
  # restart. block_validation carries one ENTER line per block with its hash,
  # which is what names a block holding a processing permit.
  #
  # The interpreter_util demotion does not suppress
  # f1r3fly.casper.block_validation: EnvFilter matches an event's explicit
  # target, not the module it was emitted from.
  filter = "info,tonic=error,hyper=error,tower=error,reqwest=error,heed=error,h2=error,comm::rust::transport::transport_layer=warn,casper::rust::engine::block_retriever=warn,casper::rust::engine::multi_parent_casper::validation_dispatcher=warn,casper::rust::util::rholang::interpreter_util=warn,casper::rust::blocks::block_processor=debug,f1r3fly.casper.block_validation=debug,f1r3fly.finalizer=debug,f1r3fly.casper.lfb.timing=debug,f1r3.trace.floor=debug,f1r3.trace.oracle=debug,f1r3.trace.unavail=debug,f1r3fly.casper.heartbeat.lane=debug,f1r3fly.casper.compute_parents_post_state.timing=debug,f1r3fly.block_creator.timing=debug,f1r3fly.node.web.enricher=debug"
  format = "json"
  sink   = "both"

  # The previous shard's stall began ~4.5 days after start and had already
  # rotated out of every node's log ring. Measured ~85 MB/node/day, so 7 days
  # is ~600 MB/node.
  file {
    rotation  = "daily"
    retention = 7
  }
}
