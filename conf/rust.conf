# Rust node overrides — values that differ from the node's built-in defaults.
# The node loads its built-in defaults.conf first, then this file merges on top.
# Per-role behavior is controlled via CLI flags in compose files:
#   --ceremony-master-mode, --heartbeat-disabled, --genesis-validator, etc.

protocol-server {
  allow-private-addresses = true
  no-upnp = true
}

casper {
  fault-tolerance-threshold = 0.1
  requested-blocks-timeout = 5 seconds
  fork-choice-stale-threshold = 1 minutes
  fork-choice-check-if-stale-interval = 20 seconds

  genesis-ceremony {
    required-signatures = 2
    approve-interval = 10 seconds
  }

  genesis-block-data {
    number-of-active-validators = 10000
    # Lower than the node default (10000) so epoch transitions happen
    # frequently in test sessions. With heartbeat producing blocks every
    # ~5s, a 4-block epoch transitions every ~20s — fast enough that a
    # bonded validator activates within one or two heartbeat rounds.
    # Tests needing a different cadence override via CLI flags.
    epoch-length = 4
    quarantine-length = 10
  }
}

logging {
  # Production filter: INFO baseline (keeps the operational startup/consensus INFO that the
  # integration suite's log-scanning tests assert on — e.g. native_token_metadata_startup at
  # casper::rust::engine::casper_launch) with the diagnostic merge/seal targets suppressed to
  # warn. So the per-channel rholang.dispatcher trace + the debug/trace merge instrumentation
  # stay OFF (no perf contamination; the tracing::enabled!-gated probes also stay gated), while
  # ordinary INFO logging is preserved. For deep seal/merge tracing, swap in the verbose filter
  # on the commented line below.
  # Production filter (swap back in when not flake-hunting):
  # filter = "info,tonic=error,hyper=error,tower=error,reqwest=error,heed=error,h2=error,f1r3fly.rholang.dispatcher=warn,f1r3fly.merge=warn,f1r3.trace=warn"
  # Comprehensive Phase-4 diagnostic filter (ACTIVE): full merge/seal/recovery/rspace visibility. Logs
  # every chain's per-channel footprint (chain_index), the per-channel removed/added ground truth
  # + peeked-vs-consumed classification (rspace_merge), the recovery base-check verdict (basecheck),
  # every keep-one winner/loser + conflict edge (fs_floor), merge result (merge_verdict), recovery
  # admits (recovery_gate), and floor derivation. INFO baseline preserved for the log-scanning
  # suite. Deliberately OMITS f1r3fly.contract.stdout (per-block whole-map dumps that slow nodes
  # enough to flip the failure mode — observer effect) and dispatcher=trace (heavy perf contaminant).
  filter = "info,tonic=error,hyper=error,tower=error,reqwest=error,heed=error,h2=error,f1r3fly.rholang.dispatcher=warn,f1r3fly.merge=warn,f1r3.trace=warn,f1r3.trace.chain_index=debug,f1r3.trace.basecheck=debug,f1r3.trace.fs_floor=debug,f1r3.trace.merge_verdict=info,f1r3.trace.recovery_gate=debug,f1r3.trace.floor=debug,f1r3fly.merge.channel_id=debug,f1r3fly.rspace.multidatum=debug,f1r3fly.casper.parent_selection=debug,f1r3fly.finalizer.decision=debug,f1r3fly.casper.safety.clique_oracle=debug,f1r3fly.casper.bonds_validation=debug,f1r3fly.casper.divergence=info,f1r3.trace.statech=debug"
  # Verbose diagnostic filter (seal/merge debugging) — restore by swapping for the line above:
  # filter = "warn,tonic=error,hyper=error,tower=error,reqwest=error,heed=error,h2=error,f1r3fly.contract.stdout=info,f1r3fly.contract.stderr=info,f1r3fly.finalizer=info,f1r3fly.finalizer.decision=debug,f1r3fly.casper.safety.clique_oracle=debug,f1r3fly.casper.bonds_validation=debug,f1r3fly.casper.divergence=info,f1r3fly.casper.parent_selection=debug,f1r3fly.casper.block_validation=info,f1r3fly.casper.block_processing=info,f1r3fly.merge.dag=debug,f1r3fly.rspace.multidatum=debug,f1r3fly.merge.provenance=info,f1r3fly.merge.tomerge=debug,f1r3fly.casper.compute_parents_post_state=debug,f1r3.trace.floor=debug,f1r3.trace.fs_floor=debug,f1r3.trace.fateprobe=trace,f1r3.trace.lm_register=debug,f1r3.trace.merge_verdict=info,f1r3fly.merge.orphan_input=info,f1r3fly.rholang.dispatcher=trace,f1r3fly.merge.mergeable_exempt=debug,f1r3fly.merge.channel_id=debug,node::rust::instances::heartbeat_proposer=debug,node::rust::instances::proposer_instance=debug,casper::rust::blocks::proposer=info,f1r3fly.casper=debug"
  format = "json"
  sink   = "both"
}
