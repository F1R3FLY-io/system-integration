# Rust node overrides — values that differ from the node's built-in defaults.
# The node loads its built-in defaults.conf first, then this file merges on top.
# Per-role behavior is controlled via CLI flags in compose files:
#   --ceremony-master-mode, --heartbeat-disabled, --genesis-validator, etc.

protocol-server {
  allow-private-addresses = true
  no-upnp = true
}

casper {
  fault-tolerance-threshold = 0.1
  requested-blocks-timeout = 5 seconds
  fork-choice-stale-threshold = 1 minutes
  fork-choice-check-if-stale-interval = 20 seconds

  # The frozen per-block floor is the clock for the retry gate, the merge
  # window, and the lifecycle register's terminal verdicts — heartbeat
  # cadence drives it.
  #
  # These are the NODE DEFAULTS, deliberately. The previous test values
  # (2s/2s/1s/1s) set `max-lfb-age` equal to `check-interval`, so the LFB
  # read as stale at essentially every tick and all validators proposed
  # every tick: ~90 blocks/min with `deploys_in_scope = 0`, i.e. empty-block
  # churn. Every one of those blocks costs a multi-parent merge plus
  # validation on every node, and the resulting allocation spikes (measured
  # 17.8 GB on a 5-node shard) drove hosts into the OOM killer.
  #
  # The latency cost is small: finalization trails the tip by ~2 BLOCKS
  # (measured), and blocks arrive at ~n_validators/check-interval, so this
  # moves verdict latency from ~1.3s to ~3.3s against a 135s test budget.
  # Cadence was never the binding constraint on suite runtime.
  heartbeat {
    check-interval = 5 seconds
    max-lfb-age = 5 seconds
    self-propose-cooldown = 3 seconds
    # Recovery paces on finalization age AND own-proposal cadence (never
    # frontier age — arriving peer blocks cannot reset the clock, so one
    # validator's non-finalizing chain cannot pacify recovery on its
    # peers). The own-cadence conjunct prevents empty-block churn while
    # healthy.
    stale-recovery-min-interval = 3 seconds
  }

  # Small uniform adjudication horizon for test shards. max-parent-depth
  # is both the parent-spread validity bound and the deploy-lifecycle
  # citability horizon: a terminal Expired/Failed verdict is written only
  # once the finalized floor passes max(window end, last inclusion) +
  # max-parent-depth, so the node default (100) would hold every missed
  # deploy Pending for ~100 blocks past its validity window. 15 keeps
  # terminal verdicts observable in short runs while staying above the
  # actual tip spread. Also narrows the rspace history-horizon/GC window
  # — fine for ephemeral test shards.
  max-parent-depth = 15

  genesis-ceremony {
    required-signatures = 2
    approve-interval = 10 seconds
  }

  genesis-block-data {
    number-of-active-validators = 10000
    # Still far below the node default (10000) so epoch behaviour is
    # observable in a test session, but no longer 4: at 4 an epoch boundary
    # — a PoS closeBlock with payouts — fell every fourth block, i.e. many
    # times a minute, for suites that never bond a validator. That is pure
    # overhead on the concurrency suites and it compounds the merge load
    # that drives the shard's memory spikes.
    #
    # Suites that DO exercise bonding need short epochs and set them
    # explicitly via CLI (`--epoch-length`), which overrides this file:
    #   tests/custom/test_validator_lifecycle.py
    #   tests/shared/test_bonding_validators.py (via the shared_shard fixture)
    epoch-length = 50
    quarantine-length = 10
  }
}

logging {
  # Production filter (swap in for timing-sensitive baseline runs): INFO baseline — keeps
  # the operational startup/consensus INFO the log-scanning tests assert on, all debug
  # instrumentation off. The three verdict-plane INFO lines (deploy lifecycle terminal
  # verdict written; N retr(y/ies) deferred by the retry gate; heartbeat stale-decline)
  # all pass this baseline.
  # filter = "info,tonic=error,hyper=error,tower=error,reqwest=error,heed=error,h2=error"
  # Failure-forensics filter (ACTIVE): INFO baseline plus the debug streams needed to
  # diagnose a failed run from its first occurrence. Target names drift across branches —
  # before trusting a directive here, check it still exists: git grep 'target: "<name>"'.
  # Verified against feat/verdict-plane:
  #   f1r3fly.casper.recovery=debug   per-decision retry-gate/recovery basis (debug is
  #                                   the deepest level; the INFO lines carry counts only)
  #   f1r3fly.merge.cpps=debug        compute_parents_post_state + deploy-selection step
  #                                   markers (ENTER/EXIT/REBASE/FLOOR, POOL/FILTER/CHOSEN)
  #                                   — a handful of lines per merge/propose; carries the
  #                                   fast-path-vs-rebase decision and its floor
  #   f1r3fly.casper.lfb.timing=debug one line per finalizer run: finalizer_ms +
  #                                   new_lfb_found — the LFB adopt-vs-hold marker
  #   f1r3.trace.floor=debug          "finalized floor derived" with floor_number — the
  #                                   floor clock's advance signal (grep the high-water).
  #                                   Also "state-containment verdict" (per-pair exit
  #                                   reason: same-block / on-lineage / no-settled-content /
  #                                   contained / missing-settled-sigs + missing_sigs count /
  #                                   disconnected-lineages) and "floor candidate skipped" —
  #                                   together they say WHY every floor advance was
  #                                   allowed or refused (added after the 5fdb9bfe
  #                                   suppressed-record erasure was reconstructed by hand)
  #   f1r3.trace.oracle=debug         "ft_witnessed_exact verdict": agreeing weight,
  #                                   max_clique_weight, total_stake, the latest-message
  #                                   snapshot and the agreeing validators — the
  #                                   certification forensics for a finalization verdict
  #   parent_selection / clique_oracle / bonds_validation = fork-choice, finalization,
  #                                   and bonds forensics
  # Escalation (off by default): f1r3fly.merge.step=debug — per-chain source
  # attribution + dedup retain/drop; measured 98.7% of all log volume (~5 GB/node per
  # ucc run) — enable only when a specific merge decision is under investigation.
  # f1r3.trace.floor_walk=debug — per-step floor-walk detail with per-parent oracle
  # calls; high volume. f1r3fly.casper.lifecycle emits a single INFO line per terminal
  # verdict (no debug/trace split exists) — it needs no directive here.
  #   f1r3.trace.unavail=debug        the availability splitter's per-chain reject
  #                                   reasons ("remove not available at base") — low
  #                                   volume, and the only account of WHY a chain was
  #                                   dropped from a merge
  filter = "info,tonic=error,hyper=error,tower=error,reqwest=error,heed=error,h2=error,f1r3fly.casper.recovery=debug,f1r3.trace.floor=debug,f1r3fly.casper.parent_selection=debug,f1r3fly.casper.safety.clique_oracle=debug,f1r3fly.casper.bonds_validation=debug,f1r3fly.merge.cpps=debug,f1r3fly.casper.lfb.timing=debug,f1r3.trace.oracle=debug,f1r3.trace.unavail=debug"
  format = "json"
  sink   = "both"

  # Bounded retention. The file sink is the authoritative log every diagnostic
  # scan reads, so it must survive a long run without filling the disk: minutely
  # rotation with a file cap bounds it to roughly `retention` minutes of history
  # regardless of level. A failure is diagnosed from the window around it, and
  # the hunt tooling snapshots that window on a catch — keeping days of debug
  # output only buys a full disk (measured: ~2 GB/min per shard at debug).
  file {
    rotation  = "minutely"
    # Minutes of history retained. A failure is usually diagnosed well after
    # the event — 20 was too tight and deleted the window before it could be
    # read. At the standing filter this is tens of MB; an escalation run that
    # enables f1r3fly.merge.step writes ~2 GB/min per shard and must be given
    # a larger disk (hunt-launch.sh HUNT_BOOT_GB) rather than a shorter
    # retention, or the window is gone before the catch is inspected.
    retention = 60
  }
}
