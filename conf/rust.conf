# Rust node overrides — values that differ from the node's built-in defaults.
# The node loads its built-in defaults.conf first, then this file merges on top.
# Per-role behavior is controlled via CLI flags in compose files:
#   --ceremony-master-mode, --heartbeat-disabled, --genesis-validator, etc.

protocol-server {
  allow-private-addresses = true
  no-upnp = true
}

casper {
  fault-tolerance-threshold = 0.1
  requested-blocks-timeout = 5 seconds
  fork-choice-stale-threshold = 1 minutes
  fork-choice-check-if-stale-interval = 20 seconds

  heartbeat {
    enabled = true
  }

  genesis-ceremony {
    required-signatures = 2
    approve-interval = 10 seconds
  }

  genesis-block-data {
    number-of-active-validators = 10000
    # Lower than the node default (10000) so epoch transitions happen
    # frequently in test sessions. With heartbeat producing blocks every
    # ~5s, a 4-block epoch transitions every ~20s — fast enough that a
    # bonded validator activates within one or two heartbeat rounds.
    # Tests needing a different cadence override via CLI flags.
    epoch-length = 4
    quarantine-length = 10
  }
}

metrics {
  prometheus = true
}
