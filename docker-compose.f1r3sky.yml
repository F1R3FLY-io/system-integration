services:
  # PostgreSQL database for AT Protocol services
  postgres:
    image: postgres:16-alpine
    container_name: f1r3sky-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-atproto}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - f1r3fly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache for AT Protocol services
  redis:
    image: redis:7-alpine
    container_name: f1r3sky-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - f1r3fly
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BSKY Migration - runs database migrations before services start
  bsky-migrate:
    image: f1r3flyindustries/f1r3sky-bsky:latest
    container_name: f1r3sky-bsky-migrate
    env_file:
      - .env.f1r3sky
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - f1r3fly
    command: >
      node -e "
      const { Database } = require('@atproto/bsky');
      (async () => {
        console.log('Running bsky database migrations...');
        const db = new Database({
          url: process.env.BSKY_DB_POSTGRES_URL || 'postgresql://postgres:postgres@postgres:5432/atproto',
          schema: process.env.BSKY_DB_POSTGRES_SCHEMA
        });
        await db.migrateToLatestOrThrow();
        await db.close();
        console.log('Bsky migrations complete!');
      })();
      "
    restart: "no"

  # BSKY DataPlane Server - serves indexed data via gRPC
  dataplane:
    image: f1r3flyindustries/f1r3sky-bsky:latest
    container_name: f1r3sky-dataplane
    ports:
      - "2585:2585"
    env_file:
      - .env.f1r3sky
    environment:
      DATAPLANE_PORT: 2585
    command: >
      node -e "
      const { Database, DataPlaneServer, RepoSubscription } = require('@atproto/bsky');
      (async () => {
        const port = parseInt(process.env.DATAPLANE_PORT || process.env.PORT || '2585', 10);
        const plcUrl =
          process.env.BSKY_DID_PLC_URL ||
          process.env.DID_PLC_URL ||
          'https://plc.directory';
        const repoSubUrls = (process.env.DATAPLANE_REPOSUBSCRIPTION_URLS || '').split(',').map(s => s.trim()).filter(Boolean);
        if (!repoSubUrls.length) {
          throw new Error('Missing DATAPLANE_REPOSUBSCRIPTION_URLS (expected e.g. ws://pds:2583)');
        }
        const db = new Database({
          url: process.env.BSKY_DB_POSTGRES_URL || 'postgresql://postgres:postgres@postgres:5432/atproto',
          schema: process.env.BSKY_DB_POSTGRES_SCHEMA,
        });
        console.log('Starting bsky dataplane server...');
        const dp = await DataPlaneServer.create(db, port, plcUrl);
        console.log('Starting bsky dataplane repo subscription...');
        const sub = new RepoSubscription({ service: repoSubUrls[0], db, idResolver: dp.idResolver });
        sub.start();
        const shutdown = async () => {
          console.log('Shutting down bsky dataplane...');
          try { await sub.destroy(); } catch (err) { console.error(err); }
          try { await dp.destroy(); } catch (err) { console.error(err); }
          try { await db.close(); } catch (err) { console.error(err); }
          process.exit(0);
        };
        process.on('SIGTERM', shutdown);
        process.on('SIGINT', shutdown);
      })();
      "
    depends_on:
      postgres:
        condition: service_healthy
      bsky-migrate:
        condition: service_completed_successfully
    networks:
      - f1r3fly
    restart: unless-stopped

  # BSKY AppView service (app.bsky.* API endpoints)
  bsky:
    image: f1r3flyindustries/f1r3sky-bsky:latest
    container_name: f1r3sky-bsky
    ports:
      - "2584:2584"
    env_file:
      - .env.f1r3sky
    environment:
      # Port (not in env file)
      PORT: 2584
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bsky-migrate:
        condition: service_completed_successfully
      dataplane:
        condition: service_started
      bsync:
        condition: service_started
    networks:
      - f1r3fly
    restart: unless-stopped

  # PDS (Personal Data Server) - hosts atproto account data
  pds:
    image: f1r3flyindustries/f1r3sky-pds:latest
    container_name: f1r3sky-pds
    user: root
    ports:
      - "2583:2583"
    env_file:
      - .env.f1r3sky
    volumes:
      - pds_blocks:/pds/blocks
      - pds_tmp:/pds/tmp
      - pds_data:/pds
    environment:
      # Port (not in env file)
      PORT: 2583
      # Blockchain node integration
      DEPLOY_SERVICE_URL: ${DEPLOY_SERVICE_URL:-http://rnode.validator1:40401}
      PROPOSE_SERVICE_URL: ${PROPOSE_SERVICE_URL:-http://rnode.validator1:40402}
      READ_NODE_URL: ${READ_NODE_URL:-http://rnode.readonly:40403}
      READ_NODE_WS_URL: ${READ_NODE_WS_URL:-ws://rnode.readonly:40403}
      DEFAULT_WALLET_KEY: ${DEFAULT_WALLET_KEY:-232DADA5BBAFC0799D5F370DA04AF70CE438F69F954512B26D6FB5B560B81DFE}
      DEFAULT_WALLET_ADDRESS: ${DEFAULT_WALLET_ADDRESS:-1111EjdAxnKb5zKUc8ikuxfdi3kwSGH7BJCHKWjnVzfAF3SjCBvjh}
    depends_on:
      postgres:
        condition: service_healthy
      bsky:
        condition: service_started
    networks:
      - f1r3fly
    restart: unless-stopped

  # BSYNC Migration - runs database migrations for bsync
  bsync-migrate:
    image: f1r3flyindustries/f1r3sky-bsync:latest
    container_name: f1r3sky-bsync-migrate
    env_file:
      - .env.f1r3sky
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - f1r3fly
    command: >
      node -e "
      const { Database } = require('@atproto/bsync');
      (async () => {
        console.log('Running bsync database migrations...');
        const db = new Database({
          url: process.env.BSYNC_DB_POSTGRES_URL || process.env.BSKY_DB_POSTGRES_URL || 'postgresql://postgres:postgres@postgres:5432/atproto',
          schema: process.env.BSYNC_DB_POSTGRES_SCHEMA || process.env.BSKY_DB_POSTGRES_SCHEMA
        });
        await db.migrateToLatestOrThrow();
        await db.close();
        console.log('Bsync migrations complete!');
      })();
      "
    restart: "no"

  # BSYNC (Background Sync Service)
  bsync:
    image: f1r3flyindustries/f1r3sky-bsync:latest
    container_name: f1r3sky-bsync
    ports:
      - "3100:3000"
    env_file:
      - .env.f1r3sky
    environment:
      # Port (not in env file)
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      bsync-migrate:
        condition: service_completed_successfully
    networks:
      - f1r3fly
    restart: unless-stopped

  # OZONE (Moderation Service)
  ozone:
    image: f1r3flyindustries/f1r3sky-ozone:latest
    container_name: f1r3sky-ozone
    ports:
      - "3101:3001"
    env_file:
      - .env.f1r3sky
    environment:
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      bsky:
        condition: service_started
      pds:
        condition: service_started
    networks:
      - f1r3fly
    restart: unless-stopped

  # F1R3SKY Frontend Web App (bskyweb) - requires ~/.npmrc with GitHub token
  # EXPO_PUBLIC_* vars must be passed as build args because the bskyweb Go binary
  # serves a pre-compiled JS bundle — it cannot inject env vars at runtime.
  # These are browser-side URLs and must point to host-accessible ports.
  f1r3sky:
    build:
      context: ./services/f1r3sky
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_EMBERS_API_URL: ${EXPO_PUBLIC_EMBERS_API_URL:-http://localhost:8080}
        EXPO_PUBLIC_EMBERS_URL: ${EXPO_PUBLIC_EMBERS_URL:-http://localhost:5173}
      secrets:
        - npmrc
    image: f1r3flyindustries/f1r3sky:latest
    container_name: f1r3sky
    ports:
      - "8100:8100"
    environment:
      HTTP_ADDRESS: ":8100"
      ATP_APPVIEW_HOST: "http://bsky:2584"
      DEBUG: "false"
    depends_on:
      bsky:
        condition: service_started
      pds:
        condition: service_started
    networks:
      - f1r3fly
    restart: unless-stopped
    command: ["/usr/bin/bskyweb", "serve"]

secrets:
  npmrc:
    file: ~/.npmrc

networks:
  f1r3fly:
    name: f1r3fly
    external: true

volumes:
  postgres_data:
  redis_data:
  pds_blocks:
  pds_tmp:
  pds_data:
