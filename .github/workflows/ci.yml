name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        run: |
          pip install poetry
          poetry install --only dev

      - name: Ruff lint
        run: poetry run ruff check shardctl/ integration-tests/test/

      - name: Ruff format check
        run: poetry run ruff format --check shardctl/ integration-tests/test/

      - name: YAML validation
        run: |
          python3 << 'SCRIPT'
          import yaml, glob, sys
          errors = []
          for pattern in ['compose/*.yml', 'services.yml', '*.yml', '*.yaml']:
              for f in glob.glob(pattern):
                  try:
                      yaml.safe_load(open(f))
                  except yaml.YAMLError as e:
                      errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)
          SCRIPT

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev,integration

      - name: Run unit tests
        run: |
          poetry run pytest integration-tests/test/test_internal.py \
            -v --tb=short --timeout=30
