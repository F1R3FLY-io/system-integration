name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTEST_TIMEOUT_ARGS: >-
    --pytest-args "--timeout=600"
  FINALIZED_BLOCK_TARGET: 10

jobs:
  validate:
    name: Validate & CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install shardctl
        run: |
          pip install poetry
          poetry install
      - name: Validate all compose files
        run: |
          FAIL=0
          for cf in \
            compose/f1r3node-rust.yml compose/f1r3node-rust-standalone.yml \
            compose/f1r3node-rust-observer.yml compose/f1r3node-rust-validator4.yml \
            compose/f1r3node.yml compose/f1r3node-standalone.yml \
            compose/f1r3node-observer.yml compose/f1r3node-validator4.yml \
            compose/f1r3node-shard-light.yml compose/embers.yml \
            compose/f1r3sky.yml compose/monitoring.yml \
            integration-tests/docker-compose.rust.yml integration-tests/docker-compose.scala.yml \
            integration-tests/docker-compose.standalone-rust.yml integration-tests/docker-compose.standalone-scala.yml
          do
            if docker compose --env-file .env.node -f "$cf" config >/dev/null 2>&1; then
              echo "PASS: $cf"
            else
              echo "FAIL: $cf"
              FAIL=$((FAIL + 1))
            fi
          done
          [ "$FAIL" -eq 0 ] || (echo "$FAIL compose file(s) failed validation" && exit 1)
      - name: Verify shardctl CLI
        run: |
          poetry run shardctl --help
          poetry run shardctl status || true
          poetry run shardctl ps || true

  # ===========================================================
  # Topology Health Checks (10 finalized blocks each)
  # ===========================================================
  rust-shard:
    name: Rust Shard (10 finalized)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install
      - run: docker pull f1r3flyindustries/f1r3fly-rust-node:latest
      - name: Start shard and wait for Running
        run: |
          poetry run shardctl up f1r3node-rust
          poetry run shardctl wait --timeout 300
          poetry run shardctl status
      - name: Wait for 10 finalized blocks
        run: |
          TARGET=${{ env.FINALIZED_BLOCK_TARGET }}
          for i in $(seq 1 60); do
            LFB=$(curl -sf http://localhost:40413/api/last-finalized-block 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('blockInfo',{}).get('blockNumber',0))" 2>/dev/null || echo 0)
            echo "  [$((i*5))s] LFB: #$LFB"
            if [ "$LFB" -ge "$TARGET" ] 2>/dev/null; then
              echo "Reached LFB #$LFB"
              break
            fi
            sleep 5
          done
          [ "$LFB" -ge "$TARGET" ] 2>/dev/null || (echo "FAIL: LFB only at #$LFB after 300s" && exit 1)
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rust-shard
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: poetry run shardctl reset -y || true

  rust-standalone:
    name: Rust Standalone (10 finalized)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install
      - run: docker pull f1r3flyindustries/f1r3fly-rust-node:latest
      - name: Start standalone and wait for Running
        run: |
          poetry run shardctl up f1r3node-rust-standalone
          poetry run shardctl wait --timeout 120
          poetry run shardctl status
      - name: Wait for 10 finalized blocks
        run: |
          TARGET=${{ env.FINALIZED_BLOCK_TARGET }}
          for i in $(seq 1 60); do
            LFB=$(curl -sf http://localhost:40403/api/last-finalized-block 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('blockInfo',{}).get('blockNumber',0))" 2>/dev/null || echo 0)
            echo "  [$((i*5))s] LFB: #$LFB"
            if [ "$LFB" -ge "$TARGET" ] 2>/dev/null; then
              echo "Reached LFB #$LFB"
              break
            fi
            sleep 5
          done
          [ "$LFB" -ge "$TARGET" ] 2>/dev/null || (echo "FAIL: LFB only at #$LFB after 300s" && exit 1)
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rust-standalone
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: poetry run shardctl reset -y || true

  scala-shard:
    # Unstable on 2-core/7GB GitHub runners: 5 Scala JVMs compete for CPU/RAM
    # during genesis (f1r3node#452). Step-level continue-on-error keeps job green.
    name: Scala Shard (10 finalized)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install
      - run: docker pull f1r3flyindustries/f1r3fly-scala-node:latest
      - name: Start shard and wait for 10 finalized blocks
        continue-on-error: true
        run: |
          poetry run shardctl up f1r3node
          poetry run shardctl wait --timeout 420
          poetry run shardctl status
          TARGET=${{ env.FINALIZED_BLOCK_TARGET }}
          for i in $(seq 1 60); do
            LFB=$(curl -sf http://localhost:40413/api/last-finalized-block 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('blockInfo',{}).get('blockNumber',0))" 2>/dev/null || echo 0)
            echo "  [$((i*5))s] LFB: #$LFB"
            if [ "$LFB" -ge "$TARGET" ] 2>/dev/null; then
              echo "Reached LFB #$LFB"
              break
            fi
            sleep 5
          done
          [ "$LFB" -ge "$TARGET" ] 2>/dev/null || (echo "WARN: LFB only at #$LFB after 300s (flaky on 2-core runners)" && exit 1)
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-scala-shard
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: poetry run shardctl reset -y || true

  scala-standalone:
    name: Scala Standalone (10 finalized)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install
      - run: docker pull f1r3flyindustries/f1r3fly-scala-node:latest
      - name: Start standalone and wait for Running
        run: |
          poetry run shardctl up f1r3node-standalone
          poetry run shardctl wait --timeout 120
          poetry run shardctl status
      - name: Wait for 10 finalized blocks
        run: |
          TARGET=${{ env.FINALIZED_BLOCK_TARGET }}
          for i in $(seq 1 60); do
            LFB=$(curl -sf http://localhost:40403/api/last-finalized-block 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('blockInfo',{}).get('blockNumber',0))" 2>/dev/null || echo 0)
            echo "  [$((i*5))s] LFB: #$LFB"
            if [ "$LFB" -ge "$TARGET" ] 2>/dev/null; then
              echo "Reached LFB #$LFB"
              break
            fi
            sleep 5
          done
          [ "$LFB" -ge "$TARGET" ] 2>/dev/null || (echo "FAIL: LFB only at #$LFB after 300s" && exit 1)
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-scala-standalone
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: poetry run shardctl reset -y || true

  scala-light:
    name: Scala Light Shard (10 finalized)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install
      - run: docker pull f1r3flyindustries/f1r3fly-scala-node:latest
      - name: Start light shard and wait for Running
        run: |
          poetry run shardctl up f1r3node-shard-light
          poetry run shardctl wait --timeout 300
          poetry run shardctl status
      - name: Wait for 10 finalized blocks
        run: |
          TARGET=${{ env.FINALIZED_BLOCK_TARGET }}
          for i in $(seq 1 60); do
            LFB=$(curl -sf http://localhost:40413/api/last-finalized-block 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('blockInfo',{}).get('blockNumber',0))" 2>/dev/null || echo 0)
            echo "  [$((i*5))s] LFB: #$LFB"
            if [ "$LFB" -ge "$TARGET" ] 2>/dev/null; then
              echo "Reached LFB #$LFB"
              break
            fi
            sleep 5
          done
          [ "$LFB" -ge "$TARGET" ] 2>/dev/null || (echo "FAIL: LFB only at #$LFB after 300s" && exit 1)
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-scala-light
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: poetry run shardctl reset -y || true

  # ===========================================================
  # Integration Tests (each on its own runner)
  # ===========================================================
  rust-test-shard:
    name: "Rust: test_web_api (shard)"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - run: docker pull f1r3flyindustries/f1r3fly-rust-node:latest
      - name: Run test
        run: poetry run shardctl test --rust test_web_api ${{ env.PYTEST_TIMEOUT_ARGS }}
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
          cp integration-tests/report.json /tmp/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rust-test-shard
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl reset -y || true
          poetry run shardctl test-reset || true

  rust-test-standalone:
    name: "Rust: test_heartbeat (standalone)"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - run: docker pull f1r3flyindustries/f1r3fly-rust-node:latest
      - name: Run test
        run: poetry run shardctl test --rust "test_heartbeat_creates_blocks_when_idle and not shard" ${{ env.PYTEST_TIMEOUT_ARGS }}
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
          cp integration-tests/report.json /tmp/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rust-test-standalone
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl reset -y || true
          poetry run shardctl test-reset || true

  rust-test-custom:
    name: "Rust: test_synchrony (custom)"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - run: docker pull f1r3flyindustries/f1r3fly-rust-node:latest
      - name: Run test
        run: poetry run shardctl test --rust test_synchrony_constraint ${{ env.PYTEST_TIMEOUT_ARGS }}
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
          cp integration-tests/report.json /tmp/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rust-test-custom
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl reset -y || true
          poetry run shardctl test-reset || true

  scala-test-shard:
    # Unstable on 2-core/7GB GitHub runners: Scala shard startup can exceed
    # timeout when JVMs compete for resources during genesis (f1r3node#452).
    name: "Scala: test_web_api (shard)"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - run: docker pull f1r3flyindustries/f1r3fly-scala-node:latest
      - name: Run test
        continue-on-error: true
        run: poetry run shardctl test --scala test_web_api ${{ env.PYTEST_TIMEOUT_ARGS }}
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
          cp integration-tests/report.json /tmp/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-scala-test-shard
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl reset -y || true
          poetry run shardctl test-reset || true

  scala-test-standalone:
    name: "Scala: test_heartbeat (standalone)"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - run: docker pull f1r3flyindustries/f1r3fly-scala-node:latest
      - name: Run test
        run: poetry run shardctl test --scala "test_heartbeat_creates_blocks_when_idle and not shard" ${{ env.PYTEST_TIMEOUT_ARGS }}
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
          cp integration-tests/report.json /tmp/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-scala-test-standalone
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl reset -y || true
          poetry run shardctl test-reset || true

  scala-test-custom:
    name: "Scala: test_synchrony (custom)"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - run: docker pull f1r3flyindustries/f1r3fly-scala-node:latest
      - name: Run test
        run: poetry run shardctl test --scala test_synchrony_constraint ${{ env.PYTEST_TIMEOUT_ARGS }}
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
          cp integration-tests/report.json /tmp/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-scala-test-custom
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl reset -y || true
          poetry run shardctl test-reset || true

  # ===========================================================
  # Monitoring Stack Validation
  # ===========================================================
  # Verifies Prometheus DNS discovery, recording rules, and Grafana
  # dashboard provisioning against each topology.

  monitoring-rust-shard:
    name: "Monitoring: Rust Shard"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install
      - run: docker pull f1r3flyindustries/f1r3fly-rust-node:latest
      - name: Start shard
        run: |
          poetry run shardctl up f1r3node-rust
          poetry run shardctl wait --timeout 300
      - name: Start monitoring
        run: |
          poetry run shardctl up monitoring
          sleep 20
      - name: Verify Prometheus targets
        run: |
          UP=$(curl -sf http://localhost:9090/api/v1/targets | \
            python3 -c "import sys,json; t=json.load(sys.stdin)['data']['activeTargets']; print(sum(1 for x in t if x['health']=='up'))")
          DOWN=$(curl -sf http://localhost:9090/api/v1/targets | \
            python3 -c "import sys,json; t=json.load(sys.stdin)['data']['activeTargets']; print(sum(1 for x in t if x['health']=='down'))")
          echo "Targets UP=$UP DOWN=$DOWN"
          [ "$UP" -ge 5 ] || (echo "FAIL: expected >=5 UP targets, got $UP" && exit 1)
          [ "$DOWN" -eq 0 ] || (echo "FAIL: expected 0 DOWN targets, got $DOWN" && exit 1)
      - name: Verify recording rules
        run: |
          RULES=$(curl -sf http://localhost:9090/api/v1/rules | \
            python3 -c "import sys,json; g=json.load(sys.stdin)['data']['groups']; print(sum(len(x['rules']) for x in g))")
          echo "Recording rules: $RULES"
          [ "$RULES" -gt 0 ] || (echo "FAIL: no recording rules loaded" && exit 1)
      - name: Verify metric data end-to-end
        run: |
          echo "--- Node metrics in Prometheus ---"
          SERIES=$(curl -sf 'http://localhost:9090/api/v1/query?query=up{job="f1r3node"}' | \
            python3 -c "import sys,json; r=json.load(sys.stdin)['data']['result']; [print(f'  {x[\"metric\"].get(\"instance\",\"?\")}: {x[\"value\"][1]}') for x in r]; print(len(r))")
          [ "$SERIES" -ge 1 ] || (echo "FAIL: no node metric data in Prometheus" && exit 1)

          echo "--- cAdvisor container metrics ---"
          CADVISOR=$(curl -sf 'http://localhost:9090/api/v1/query?query=container_memory_usage_bytes{name=~"rnode.*"}' | \
            python3 -c "import sys,json; r=json.load(sys.stdin)['data']['result']; [print(f'  {x[\"metric\"][\"name\"]}: {int(float(x[\"value\"][1]))/1048576:.0f} MB') for x in r]; print(len(r))")
          [ "$CADVISOR" -ge 1 ] || (echo "FAIL: no cAdvisor metrics for rnode containers" && exit 1)
      - name: Verify Grafana dashboards and datasource
        run: |
          curl -sf http://localhost:3000/api/health
          DASHBOARDS=$(curl -sf -u admin:admin http://localhost:3000/api/search | \
            python3 -c "import sys,json; ds=json.load(sys.stdin); [print(f'  {d[\"title\"]}') for d in ds]; print(len(ds))")
          [ "$DASHBOARDS" -ge 2 ] || (echo "FAIL: expected >=2 dashboards, got $DASHBOARDS" && exit 1)

          echo "--- Grafana -> Prometheus connectivity ---"
          GF_QUERY=$(curl -sf -u admin:admin \
            'http://localhost:3000/api/datasources/proxy/uid/prometheus/api/v1/query?query=up' | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          [ "$GF_QUERY" = "success" ] || (echo "FAIL: Grafana cannot query Prometheus" && exit 1)
          echo "Grafana -> Prometheus: $GF_QUERY"
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl down monitoring || true
          poetry run shardctl reset -y || true

  monitoring-rust-standalone:
    name: "Monitoring: Rust Standalone"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install
      - run: docker pull f1r3flyindustries/f1r3fly-rust-node:latest
      - name: Start standalone
        run: |
          poetry run shardctl up f1r3node-rust-standalone
          poetry run shardctl wait --timeout 120
      - name: Start monitoring
        run: |
          poetry run shardctl up monitoring
          sleep 20
      - name: Verify Prometheus targets (no false DOWN)
        run: |
          UP=$(curl -sf http://localhost:9090/api/v1/targets | \
            python3 -c "import sys,json; t=json.load(sys.stdin)['data']['activeTargets']; print(sum(1 for x in t if x['health']=='up'))")
          DOWN=$(curl -sf http://localhost:9090/api/v1/targets | \
            python3 -c "import sys,json; t=json.load(sys.stdin)['data']['activeTargets']; print(sum(1 for x in t if x['health']=='down'))")
          echo "Targets UP=$UP DOWN=$DOWN"
          [ "$UP" -ge 1 ] || (echo "FAIL: expected >=1 UP target, got $UP" && exit 1)
          [ "$DOWN" -eq 0 ] || (echo "FAIL: expected 0 DOWN targets, got $DOWN (issue #32 regression)" && exit 1)
      - name: Verify recording rules
        run: |
          RULES=$(curl -sf http://localhost:9090/api/v1/rules | \
            python3 -c "import sys,json; g=json.load(sys.stdin)['data']['groups']; print(sum(len(x['rules']) for x in g))")
          echo "Recording rules: $RULES"
          [ "$RULES" -gt 0 ] || (echo "FAIL: no recording rules loaded" && exit 1)
      - name: Verify metric data end-to-end
        run: |
          echo "--- Node metrics in Prometheus ---"
          SERIES=$(curl -sf 'http://localhost:9090/api/v1/query?query=up{job="f1r3node"}' | \
            python3 -c "import sys,json; r=json.load(sys.stdin)['data']['result']; [print(f'  {x[\"metric\"].get(\"instance\",\"?\")}: {x[\"value\"][1]}') for x in r]; print(len(r))")
          [ "$SERIES" -ge 1 ] || (echo "FAIL: no node metric data in Prometheus" && exit 1)

          echo "--- cAdvisor container metrics ---"
          CADVISOR=$(curl -sf 'http://localhost:9090/api/v1/query?query=container_memory_usage_bytes{name=~"rnode.*"}' | \
            python3 -c "import sys,json; r=json.load(sys.stdin)['data']['result']; [print(f'  {x[\"metric\"][\"name\"]}: {int(float(x[\"value\"][1]))/1048576:.0f} MB') for x in r]; print(len(r))")
          [ "$CADVISOR" -ge 1 ] || (echo "FAIL: no cAdvisor metrics for rnode containers" && exit 1)
      - name: Verify Grafana dashboards and datasource
        run: |
          curl -sf http://localhost:3000/api/health
          DASHBOARDS=$(curl -sf -u admin:admin http://localhost:3000/api/search | \
            python3 -c "import sys,json; ds=json.load(sys.stdin); [print(f'  {d[\"title\"]}') for d in ds]; print(len(ds))")
          [ "$DASHBOARDS" -ge 2 ] || (echo "FAIL: expected >=2 dashboards, got $DASHBOARDS" && exit 1)

          echo "--- Grafana -> Prometheus connectivity ---"
          GF_QUERY=$(curl -sf -u admin:admin \
            'http://localhost:3000/api/datasources/proxy/uid/prometheus/api/v1/query?query=up' | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          [ "$GF_QUERY" = "success" ] || (echo "FAIL: Grafana cannot query Prometheus" && exit 1)
          echo "Grafana -> Prometheus: $GF_QUERY"
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl down monitoring || true
          poetry run shardctl reset -y || true

