  # ===========================================================
  # Integration Tests (each on its own runner)
  # ===========================================================
  rust-test-shard:
    name: "Rust: test_web_api (shard)"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - run: docker pull f1r3flyindustries/f1r3fly-rust-node:latest
      - name: Run test
        run: poetry run shardctl test --rust test_web_api ${{ env.PYTEST_TIMEOUT_ARGS }}
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl reset -y || true
          poetry run shardctl test-reset || true

  rust-test-standalone:
