name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTEST_TIMEOUT_ARGS: >-
    --pytest-args "--timeout=600"
  FINALIZED_BLOCK_TARGET: 10
  F1R3FLY_RUST_IMAGE: f1r3flyindustries/f1r3fly-rust-node:dev

jobs:
  validate:
    name: Validate & CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install shardctl
        run: |
          pip install poetry
          poetry install
      - name: Validate all compose files
        run: |
          FAIL=0
          for cf in \
            compose/f1r3node-rust.yml compose/f1r3node-rust-standalone.yml \
            compose/f1r3node-rust-observer.yml compose/f1r3node-rust-validator4.yml \
            compose/f1r3node.yml compose/f1r3node-standalone.yml \
            compose/f1r3node-observer.yml compose/f1r3node-validator4.yml \
            compose/f1r3node-shard-light.yml compose/embers.yml \
            compose/f1r3sky.yml compose/monitoring.yml \
            integration-tests/docker-compose.rust.yml integration-tests/docker-compose.scala.yml \
            integration-tests/docker-compose.standalone-rust.yml integration-tests/docker-compose.standalone-scala.yml
          do
            if docker compose --env-file .env.node -f "$cf" config >/dev/null 2>&1; then
              echo "PASS: $cf"
            else
              echo "FAIL: $cf"
              FAIL=$((FAIL + 1))
            fi
          done
          [ "$FAIL" -eq 0 ] || (echo "$FAIL compose file(s) failed validation" && exit 1)
      - name: Verify shardctl CLI
        run: |
          poetry run shardctl --help
          poetry run shardctl status
          poetry run shardctl ps

  # ===========================================================
  # Topology Health Checks (10 finalized blocks each)
  # ===========================================================
  rust-shard:
    name: Rust Shard (10 finalized)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install
      - run: docker pull f1r3flyindustries/f1r3fly-rust-node:dev
      - name: Start shard and wait for Running
        run: |
          poetry run shardctl up f1r3node-rust
          poetry run shardctl wait --timeout 300
          poetry run shardctl status
      - name: Verify shardctl logs
        run: |
          OUTPUT=$(poetry run shardctl logs --tail 5 2>&1)
          echo "$OUTPUT" | head -20
          [ -n "$OUTPUT" ] || (echo "FAIL: shardctl logs returned empty" && exit 1)
      - name: Wait for 10 finalized blocks
        run: |
          TARGET=${{ env.FINALIZED_BLOCK_TARGET }}
          for i in $(seq 1 60); do
            LFB=$(curl -sf http://localhost:40413/api/last-finalized-block 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('blockInfo',{}).get('blockNumber',0))" 2>/dev/null || echo 0)
            echo "  [$((i*5))s] LFB: #$LFB"
            if [ "$LFB" -ge "$TARGET" ] 2>/dev/null; then
              echo "Reached LFB #$LFB"
              break
            fi
            sleep 5
          done
          [ "$LFB" -ge "$TARGET" ] 2>/dev/null || (echo "FAIL: LFB only at #$LFB after 300s" && exit 1)
      - name: Start monitoring
        run: |
          poetry run shardctl up monitoring
          sleep 20
      - name: Verify monitoring stack
        run: |
          echo "--- Prometheus targets ---"
          curl -sf http://localhost:9090/api/v1/targets | python3 -c "
          import sys,json; t=json.load(sys.stdin)['data']['activeTargets']
          up=sum(1 for x in t if x['health']=='up')
          down=sum(1 for x in t if x['health']=='down')
          [print(f'  {x[\"labels\"].get(\"instance\",x[\"labels\"].get(\"job\",\"?\"))}: {x[\"health\"]}') for x in t]
          print(f'UP={up} DOWN={down}')
          assert up >= 5, f'expected >=5 UP targets, got {up}'
          assert down == 0, f'expected 0 DOWN targets, got {down}'
          "

          echo "--- Recording rules ---"
          curl -sf http://localhost:9090/api/v1/rules | python3 -c "
          import sys,json; g=json.load(sys.stdin)['data']['groups']
          total=sum(len(x['rules']) for x in g)
          print(f'Recording rules: {total}')
          assert total > 0, 'no recording rules loaded'
          "

          echo "--- Node metric data ---"
          curl -sf -G http://localhost:9090/api/v1/query --data-urlencode 'query=up{job="f1r3node"}' | python3 -c "
          import sys,json; r=json.load(sys.stdin)['data']['result']
          [print(f'  {x[\"metric\"].get(\"instance\",\"?\")}: {x[\"value\"][1]}') for x in r]
          assert len(r) >= 1, 'no node metric data in Prometheus'
          "

          echo "--- cAdvisor container metrics ---"
          curl -sf -G http://localhost:9090/api/v1/query --data-urlencode 'query=container_memory_usage_bytes{name=~"rnode.*"}' | python3 -c "
          import sys,json; r=json.load(sys.stdin)['data']['result']
          [print(f'  {x[\"metric\"][\"name\"]}: {int(float(x[\"value\"][1]))/1048576:.0f} MB') for x in r]
          assert len(r) >= 1, 'no cAdvisor metrics for rnode containers'
          "

          echo "--- Grafana dashboards ---"
          curl -sf http://localhost:3000/api/health
          curl -sf -u admin:admin http://localhost:3000/api/search | python3 -c "
          import sys,json; ds=json.load(sys.stdin)
          [print(f'  {d[\"title\"]}') for d in ds]
          assert len(ds) >= 2, f'expected >=2 dashboards, got {len(ds)}'
          "

          echo "--- Grafana -> Prometheus connectivity ---"
          curl -sf -u admin:admin -G 'http://localhost:3000/api/datasources/proxy/uid/prometheus/api/v1/query' --data-urlencode 'query=up' | python3 -c "
          import sys,json; status=json.load(sys.stdin)['status']
          print(f'Grafana -> Prometheus: {status}')
          assert status == 'success', 'Grafana cannot query Prometheus'
          "
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rust-shard
          path: /tmp/logs/
          retention-days: 7
      - name: Verify monitoring teardown
        if: always()
        run: |
          poetry run shardctl down monitoring
          # Verify monitoring containers are gone
          for c in prometheus grafana cadvisor; do
            if docker ps -q --filter "name=$c" | grep -q .; then
              echo "FAIL: $c still running after shardctl down monitoring"
              exit 1
            fi
          done
          echo "Monitoring teardown verified"
      - name: Cleanup
        if: always()
        run: poetry run shardctl reset -y

