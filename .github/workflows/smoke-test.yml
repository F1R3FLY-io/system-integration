  rust-test-slash:
    # End-to-end Docker integration tests for the slashing pipeline.
    # 18 scenarios across the slashable InvalidBlock variants, the
    # slash-authorization predicate (issuer-mismatch, unknown evidence,
    # valid-but-not-invalid evidence, stale-epoch evidence), Level-2
    # closures (neglected invalid + neglected equivocation), the bug-#9
    # self-correcting widening, and §5.A.5 late-released equivocation.
    # Each test spawns its own custom shard at a distinct port_base
    # (40900–41750 in 50-port increments) and uses NodeClient to inject
    # crafted malicious blocks over the TLS transport layer.
    # xdist_group("custom") keeps these tests serial with the other
    # custom-shard tests. T-37/T-12PF (censorship) is intentionally
    # absent — boundary assumption, no runtime detector in the Rust
    # binary; see test_slash.py module docstring.
    name: "Rust: test_slash (custom)"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - run: docker pull f1r3flyindustries/f1r3fly-rust-node:dev
      - name: Run test
