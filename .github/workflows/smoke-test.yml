name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate & CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install shardctl
        run: |
          pip install poetry
          poetry install
      - name: Validate all compose files
        run: ./scripts/smoke-test.sh --validate-only
      - name: Verify shardctl CLI
        run: |
          poetry run shardctl --help
          poetry run shardctl status || true
          poetry run shardctl ps || true

  rust-shard:
    name: Rust Shard (10 blocks)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install
      - run: docker pull f1r3flyindustries/f1r3fly-rust-node:latest
      - name: Start shard and wait for Running
        run: |
          poetry run shardctl up f1r3node-rust
          poetry run shardctl wait --timeout 300
          poetry run shardctl status
      - name: Wait for 10 blocks
        run: |
          echo "Waiting for at least 10 blocks..."
          for i in $(seq 1 60); do
            BLOCK_COUNT=$(curl -sf http://localhost:40413/api/blocks/1000 2>/dev/null | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            echo "  [$((i*5))s] blocks: $BLOCK_COUNT"
            if [ "$BLOCK_COUNT" -ge 10 ] 2>/dev/null; then
              echo "Reached $BLOCK_COUNT blocks"
              break
            fi
            sleep 5
          done
          [ "$BLOCK_COUNT" -ge 10 ] 2>/dev/null || (echo "FAIL: only $BLOCK_COUNT blocks after 300s" && exit 1)
      - name: Cleanup
        if: always()
        run: poetry run shardctl reset -y || true

  rust-standalone:
    name: Rust Standalone (10 blocks)
