name: Smoke Test

on:
  push:
    branches: [main, dev]
  pull_request:
    # For pull_request this filter matches the BASE branch, so `dev` is
    # required for PRs targeting dev to get any coverage at all. Without it
    # a PR into dev runs nothing, since ci.yml (the old dev-only lint gate)
    # was removed in favour of this workflow's own lint job.
    branches: [main, dev]
  workflow_dispatch:

env:
  PYTEST_TIMEOUT_ARGS: >-
    --pytest-args "--timeout=600"
  FINALIZED_BLOCK_TARGET: 10
  # Per-job `env: F1R3FLY_NODE_IMAGE: ...` selects the image tag for that
  # job's shardctl invocations (both `shardctl up` via compose substitution
  # and `shardctl test` via the framework's resolve_node_image).
  #
  # `services.yml` uses SSH URLs (git@github.com:...) for local devs, but
  # CI has no SSH key. Rewrite to HTTPS at clone time via git's per-process
  # config override — no file changes, no per-step setup needed.
  GIT_CONFIG_PARAMETERS: "'url.https://github.com/.insteadOf=git@github.com:'"

jobs:
  validate:
    name: Validate & CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install shardctl
        run: |
          pip install poetry
          poetry install
      - name: Unit tests (shardctl + CI scripts)
        # unit-tests/ holds pure unit tests — no Docker, no shard, no OCI —
        # as distinct from integration-tests/. The explicit path is required:
        # pyproject's testpaths points at integration-tests/test/tests, so a
        # bare `pytest` would not collect these. Runs before the slower compose
        # validation so a logic regression fails fast.
        run: poetry run pytest unit-tests/ -q
      - name: Validate all compose files
        run: |
          FAIL=0
          # Enumerated rather than globbed so that a compose file added without
          # a CI entry is a visible omission, not a silent one.
          for cf in \
            compose/f1r3node-rust.yml compose/f1r3node-rust-standalone.yml \
            compose/f1r3node-rust-observer.yml compose/f1r3node-rust-validator4.yml \
            compose/f1r3node-rust-shard-light.yml compose/embers.yml \
            compose/f1r3sky.yml compose/monitoring.yml
          do
            if docker compose --env-file .env.node -f "$cf" config >/dev/null 2>&1; then
              echo "PASS: $cf"
            else
              echo "FAIL: $cf"
              FAIL=$((FAIL + 1))
            fi
          done
          [ "$FAIL" -eq 0 ] || (echo "$FAIL compose file(s) failed validation" && exit 1)
      - name: Verify shardctl CLI
        run: |
          poetry run shardctl --help
          poetry run shardctl status
          poetry run shardctl ps
          # Generic compose passthrough — exercises shardctl compose without requiring a running shard
          poetry run shardctl compose f1r3node-rust config >/dev/null
      - name: Verify shardctl test image priority
        run: |
          # Resolve image without spinning up a shard via --collect-only.
          # Priority: F1R3FLY_NODE_IMAGE env > --image > default (Rust).
          set -e
          unset F1R3FLY_NODE_IMAGE
          # --rust is a retained no-op after the Scala node was retired; assert it
          # still resolves the default rather than erroring, so the compatibility
          # promise is tested and not merely asserted in a comment.
          declare -A expectations=(
            ["--rust"]="f1r3flyindustries/f1r3fly-rust:latest"
          )
          for flag in "${!expectations[@]}"; do
            expected="${expectations[$flag]}"
            actual=$(poetry run shardctl test "$flag" --pytest-args "--collect-only -q test_does_not_exist" 2>&1 | grep -oE 'Image: \S+' | head -1 | awk '{print $2}')
            [ "$actual" = "$expected" ] || (echo "FAIL: $flag → expected $expected, got $actual" && exit 1)
            echo "PASS: $flag → $actual"
          done

          # No flag at all must also give the Rust default.
          actual=$(poetry run shardctl test --pytest-args "--collect-only -q test_does_not_exist" 2>&1 | grep -oE 'Image: \S+' | head -1 | awk '{print $2}')
          [ "$actual" = "f1r3flyindustries/f1r3fly-rust:latest" ] || (echo "FAIL: no flag → expected rust default, got $actual" && exit 1)
          echo "PASS: no flag → $actual"

          actual=$(poetry run shardctl test --image custom-marker:test --pytest-args "--collect-only -q test_does_not_exist" 2>&1 | grep -oE 'Image: \S+' | head -1 | awk '{print $2}')
          [ "$actual" = "custom-marker:test" ] || (echo "FAIL: --image → expected custom-marker:test, got $actual" && exit 1)
          echo "PASS: --image → $actual"

          actual=$(F1R3FLY_NODE_IMAGE=env-wins:test poetry run shardctl test --rust --pytest-args "--collect-only -q test_does_not_exist" 2>&1 | grep -oE 'Image: \S+' | head -1 | awk '{print $2}')
          [ "$actual" = "env-wins:test" ] || (echo "FAIL: F1R3FLY_NODE_IMAGE → expected env-wins:test, got $actual" && exit 1)
          echo "PASS: F1R3FLY_NODE_IMAGE → $actual"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev
      - name: Validate pyproject.toml
        run: poetry check
      - name: Verify poetry.lock matches pyproject.toml
        run: poetry check --lock
      # ruff does both jobs now (black and pyflakes are gone from pyproject).
      # unit-tests/ is included here deliberately — it was added after this job
      # was written and was silently unlinted.
      - name: Ruff (lint)
        run: poetry run ruff check shardctl/ integration-tests/ unit-tests/
      - name: Ruff (format check)
        run: poetry run ruff format --check shardctl/ integration-tests/ unit-tests/
      # Carried over from the removed ci.yml, which was the only place these
      # were syntax-checked. The `Validate all compose files` step uses
      # `docker compose config` on compose/ only, so services.yml, the
      # root-level compose files and the workflows themselves went unchecked.
      # pyyaml comes from the main dependency group, which `--with dev` includes.
      - name: YAML syntax (services.yml, root, workflows)
        run: |
          poetry run python - <<'PY'
          import glob, sys, yaml

          errors = []
          for pattern in ("services.yml", "*.yml", "*.yaml", ".github/workflows/*.yml"):
              for path in glob.glob(pattern):
                  try:
                      with open(path) as fh:
                          yaml.safe_load(fh)
                  except yaml.YAMLError as exc:
                      errors.append(f"{path}: {exc}")

          for err in errors:
              print(err, file=sys.stderr)
          sys.exit(1 if errors else 0)
          PY

  link-check:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Only top-level + framework docs; skip session notes / plans / service subrepos.
          # `--exclude-path` filters input files; `--exclude` filters resolved URLs
          # (needed for file:// links into services/ that aren't checked out in CI).
          args: >-
            --no-progress
            --exclude-path 'services/**'
            --exclude-path 'docs/session-context-*'
            --exclude-path 'docs/integration-test-framework-plan.md'
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^file:.*/services/'
            'README.md' 'CLAUDE.md' 'COMPOSE_STRUCTURE.md' 'docs/**/*.md' 'integration-tests/**/*.md'
          fail: true

  # ===========================================================
  # Topology Health Checks (10 finalized blocks each)
  # ===========================================================
  rust-shard:
    name: Rust Shard (10 finalized)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    env:
      F1R3FLY_NODE_IMAGE: f1r3flyindustries/f1r3fly-rust:dev
    steps:
      - uses: actions/checkout@v5
      - name: Reserve shard ports from the ephemeral range
        run: ./scripts/ci/reserve-shard-ports.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install
      - run: poetry run shardctl pull f1r3node-rust
      - name: Start shard and wait for Running
        run: |
          poetry run shardctl up f1r3node-rust
          poetry run shardctl wait --timeout 300
          poetry run shardctl status
      - name: Verify shardctl restart
        run: |
          poetry run shardctl restart f1r3node-rust
          poetry run shardctl wait --timeout 300
          poetry run shardctl status
      - name: Verify shardctl logs
        run: |
          OUTPUT=$(poetry run shardctl logs --tail 5 2>&1)
          echo "$OUTPUT" | head -20
          [ -n "$OUTPUT" ] || (echo "FAIL: shardctl logs returned empty" && exit 1)
      - name: Wait for 10 finalized blocks
        run: |
          TARGET=${{ env.FINALIZED_BLOCK_TARGET }}
          for i in $(seq 1 60); do
            LFB=$(curl -sf http://localhost:40413/api/last-finalized-block 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('blockInfo',{}).get('blockNumber',0))" 2>/dev/null || echo 0)
            echo "  [$((i*5))s] LFB: #$LFB"
            if [ "$LFB" -ge "$TARGET" ] 2>/dev/null; then
              echo "Reached LFB #$LFB"
              break
            fi
            sleep 5
          done
          [ "$LFB" -ge "$TARGET" ] 2>/dev/null || (echo "FAIL: LFB only at #$LFB after 300s" && exit 1)
      - name: Start monitoring
        run: |
          poetry run shardctl up monitoring
          sleep 20
      - name: Verify monitoring stack
        run: |
          echo "--- Prometheus targets ---"
          curl -sf http://localhost:9090/api/v1/targets | python3 -c "
          import sys,json; t=json.load(sys.stdin)['data']['activeTargets']
          up=sum(1 for x in t if x['health']=='up')
          down=sum(1 for x in t if x['health']=='down')
          [print(f'  {x[\"labels\"].get(\"instance\",x[\"labels\"].get(\"job\",\"?\"))}: {x[\"health\"]}') for x in t]
          print(f'UP={up} DOWN={down}')
          assert up >= 5, f'expected >=5 UP targets, got {up}'
          assert down == 0, f'expected 0 DOWN targets, got {down}'
          "

          echo "--- Recording rules ---"
          curl -sf http://localhost:9090/api/v1/rules | python3 -c "
          import sys,json; g=json.load(sys.stdin)['data']['groups']
          total=sum(len(x['rules']) for x in g)
          print(f'Recording rules: {total}')
          assert total > 0, 'no recording rules loaded'
          "

          echo "--- Node metric data ---"
          curl -sf -G http://localhost:9090/api/v1/query --data-urlencode 'query=up{job="f1r3node"}' | python3 -c "
          import sys,json; r=json.load(sys.stdin)['data']['result']
          [print(f'  {x[\"metric\"].get(\"instance\",\"?\")}: {x[\"value\"][1]}') for x in r]
          assert len(r) >= 1, 'no node metric data in Prometheus'
          "

          echo "--- cAdvisor container metrics ---"
          curl -sf -G http://localhost:9090/api/v1/query --data-urlencode 'query=container_memory_usage_bytes{name=~"rnode.*"}' | python3 -c "
          import sys,json; r=json.load(sys.stdin)['data']['result']
          [print(f'  {x[\"metric\"][\"name\"]}: {int(float(x[\"value\"][1]))/1048576:.0f} MB') for x in r]
          assert len(r) >= 1, 'no cAdvisor metrics for rnode containers'
          "

          echo "--- Grafana dashboards ---"
          curl -sf http://localhost:3000/api/health
          curl -sf -u admin:admin http://localhost:3000/api/search | python3 -c "
          import sys,json; ds=json.load(sys.stdin)
          [print(f'  {d[\"title\"]}') for d in ds]
          assert len(ds) >= 2, f'expected >=2 dashboards, got {len(ds)}'
          "

          echo "--- Grafana -> Prometheus connectivity ---"
          curl -sf -u admin:admin -G 'http://localhost:3000/api/datasources/proxy/uid/prometheus/api/v1/query' --data-urlencode 'query=up' | python3 -c "
          import sys,json; status=json.load(sys.stdin)['status']
          print(f'Grafana -> Prometheus: {status}')
          assert status == 'success', 'Grafana cannot query Prometheus'
          "
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rust-shard
          path: /tmp/logs/
          retention-days: 7
      - name: Verify monitoring teardown
        if: always()
        run: |
          poetry run shardctl down monitoring
          # Verify monitoring containers are gone
          for c in prometheus grafana cadvisor; do
            if docker ps -q --filter "name=$c" | grep -q .; then
              echo "FAIL: $c still running after shardctl down monitoring"
              exit 1
            fi
          done
          echo "Monitoring teardown verified"
      - name: Cleanup
        if: always()
        run: poetry run shardctl reset -y

  rust-standalone:
    name: Rust Standalone (10 finalized)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    env:
      F1R3FLY_NODE_IMAGE: f1r3flyindustries/f1r3fly-rust:dev
    steps:
      - uses: actions/checkout@v5
      - name: Reserve shard ports from the ephemeral range
        run: ./scripts/ci/reserve-shard-ports.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install
      - run: poetry run shardctl pull f1r3node-rust-standalone
      - name: Start standalone and wait for Running
        run: |
          poetry run shardctl up f1r3node-rust-standalone
          poetry run shardctl wait --timeout 120
          poetry run shardctl status
      - name: Verify shardctl logs
        run: |
          OUTPUT=$(poetry run shardctl logs --tail 5 2>&1)
          echo "$OUTPUT" | head -20
          [ -n "$OUTPUT" ] || (echo "FAIL: shardctl logs returned empty" && exit 1)
      - name: Wait for 10 finalized blocks
        run: |
          TARGET=${{ env.FINALIZED_BLOCK_TARGET }}
          for i in $(seq 1 60); do
            LFB=$(curl -sf http://localhost:40403/api/last-finalized-block 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('blockInfo',{}).get('blockNumber',0))" 2>/dev/null || echo 0)
            echo "  [$((i*5))s] LFB: #$LFB"
            if [ "$LFB" -ge "$TARGET" ] 2>/dev/null; then
              echo "Reached LFB #$LFB"
              break
            fi
            sleep 5
          done
          [ "$LFB" -ge "$TARGET" ] 2>/dev/null || (echo "FAIL: LFB only at #$LFB after 300s" && exit 1)
      - name: Start monitoring
        run: |
          poetry run shardctl up monitoring
          sleep 20
      - name: Verify monitoring stack (standalone - no false DOWN)
        run: |
          echo "--- Prometheus targets ---"
          curl -sf http://localhost:9090/api/v1/targets | python3 -c "
          import sys,json; t=json.load(sys.stdin)['data']['activeTargets']
          up=sum(1 for x in t if x['health']=='up')
          down=sum(1 for x in t if x['health']=='down')
          [print(f'  {x[\"labels\"].get(\"instance\",x[\"labels\"].get(\"job\",\"?\"))}: {x[\"health\"]}') for x in t]
          print(f'UP={up} DOWN={down}')
          assert up >= 1, f'expected >=1 UP target, got {up}'
          assert down == 0, f'expected 0 DOWN targets, got {down} (issue #32 regression)'
          "

          echo "--- Recording rules ---"
          curl -sf http://localhost:9090/api/v1/rules | python3 -c "
          import sys,json; g=json.load(sys.stdin)['data']['groups']
          total=sum(len(x['rules']) for x in g)
          print(f'Recording rules: {total}')
          assert total > 0, 'no recording rules loaded'
          "

          echo "--- Node metric data ---"
          curl -sf -G http://localhost:9090/api/v1/query --data-urlencode 'query=up{job="f1r3node"}' | python3 -c "
          import sys,json; r=json.load(sys.stdin)['data']['result']
          [print(f'  {x[\"metric\"].get(\"instance\",\"?\")}: {x[\"value\"][1]}') for x in r]
          assert len(r) >= 1, 'no node metric data in Prometheus'
          "

          echo "--- cAdvisor container metrics ---"
          curl -sf -G http://localhost:9090/api/v1/query --data-urlencode 'query=container_memory_usage_bytes{name=~"rnode.*"}' | python3 -c "
          import sys,json; r=json.load(sys.stdin)['data']['result']
          [print(f'  {x[\"metric\"][\"name\"]}: {int(float(x[\"value\"][1]))/1048576:.0f} MB') for x in r]
          assert len(r) >= 1, 'no cAdvisor metrics for rnode containers'
          "

          echo "--- Grafana dashboards ---"
          curl -sf http://localhost:3000/api/health
          curl -sf -u admin:admin http://localhost:3000/api/search | python3 -c "
          import sys,json; ds=json.load(sys.stdin)
          [print(f'  {d[\"title\"]}') for d in ds]
          assert len(ds) >= 2, f'expected >=2 dashboards, got {len(ds)}'
          "

          echo "--- Grafana -> Prometheus connectivity ---"
          curl -sf -u admin:admin -G 'http://localhost:3000/api/datasources/proxy/uid/prometheus/api/v1/query' --data-urlencode 'query=up' | python3 -c "
          import sys,json; status=json.load(sys.stdin)['status']
          print(f'Grafana -> Prometheus: {status}')
          assert status == 'success', 'Grafana cannot query Prometheus'
          "
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rust-standalone
          path: /tmp/logs/
          retention-days: 7
      - name: Verify monitoring teardown
        if: always()
        run: |
          poetry run shardctl down monitoring
          for c in prometheus grafana cadvisor; do
            if docker ps -q --filter "name=$c" | grep -q .; then
              echo "FAIL: $c still running after shardctl down monitoring"
              exit 1
            fi
          done
          echo "Monitoring teardown verified"
      - name: Verify shardctl down --volumes
        run: |
          # Exercise the explicit --volumes flag on a real running shard.
          poetry run shardctl down --volumes f1r3node-rust-standalone
          REMAIN=$(docker volume ls --filter name=f1r3fly-rust-standalone --format '{{.Name}}' | wc -l | tr -d ' ')
          [ "$REMAIN" -eq 0 ] || (echo "FAIL: down --volumes left $REMAIN volume(s) for f1r3fly-rust-standalone" && exit 1)
          REMAIN=$(docker ps -aq --filter "name=rnode.standalone" | wc -l | tr -d ' ')
          [ "$REMAIN" -eq 0 ] || (echo "FAIL: down --volumes left $REMAIN container(s)" && exit 1)
          echo "PASS: shardctl down --volumes wiped containers + volumes"
      - name: Cleanup
        if: always()
        # Exercise the aggressive prefix-scan cleanup path (skips compose detection).
        # No-op here because the previous step already cleaned up — proves --force is idempotent.
        run: poetry run shardctl reset --force -y

  # ===========================================================
  # Integration Tests (each on its own runner)
  # ===========================================================
  rust-test-shard:
    name: "Rust: test_web_api (shard)"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    env:
      F1R3FLY_NODE_IMAGE: f1r3flyindustries/f1r3fly-rust:dev
    steps:
      - uses: actions/checkout@v5
      - name: Reserve shard ports from the ephemeral range
        run: ./scripts/ci/reserve-shard-ports.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - name: Clone f1r3node-rust (defaults.conf for NodeConf)
        run: poetry run shardctl clone f1r3node-rust
      - run: poetry run shardctl pull f1r3node-rust
      - name: Run test
        # --monitor enables Docker resource sampling — embedded in report.json
        run: poetry run shardctl test --rust test_web_api --pytest-args "--timeout=600 --monitor"
      - name: Test report
        if: always()
        run: |
          [ -f integration-tests/report.json ] || (echo "FAIL: report.json not generated" && exit 1)
          poetry run shardctl test-report
          # Also exercise the --failures filter (no-op when all green; passes regardless)
          poetry run shardctl test-report --failures
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
          cp integration-tests/report.json /tmp/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rust-test-shard
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl reset -y
          poetry run shardctl test-reset

  rust-test-standalone:
    name: "Rust: test_heartbeat (standalone)"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    env:
      F1R3FLY_NODE_IMAGE: f1r3flyindustries/f1r3fly-rust:dev
    steps:
      - uses: actions/checkout@v5
      - name: Reserve shard ports from the ephemeral range
        run: ./scripts/ci/reserve-shard-ports.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - name: Clone f1r3node-rust (defaults.conf for NodeConf)
        run: poetry run shardctl clone f1r3node-rust
      - run: poetry run shardctl pull f1r3node-rust-standalone
      - name: Run test
        run: poetry run shardctl test --rust "test_heartbeat_creates_blocks_when_idle and not shard" ${{ env.PYTEST_TIMEOUT_ARGS }}
      - name: Test report
        if: always()
        run: |
          [ -f integration-tests/report.json ] || (echo "FAIL: report.json not generated" && exit 1)
          poetry run shardctl test-report
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
          cp integration-tests/report.json /tmp/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rust-test-standalone
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl reset -y
          poetry run shardctl test-reset

  rust-test-custom:
    name: "Rust: test_synchrony (custom)"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    env:
      F1R3FLY_NODE_IMAGE: f1r3flyindustries/f1r3fly-rust:dev
    steps:
      - uses: actions/checkout@v5
      - name: Reserve shard ports from the ephemeral range
        run: ./scripts/ci/reserve-shard-ports.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - name: Clone f1r3node-rust (defaults.conf for NodeConf)
        run: poetry run shardctl clone f1r3node-rust
      - run: poetry run shardctl pull f1r3node-rust
      - name: Run test
        run: poetry run shardctl test --rust test_synchrony_constraint ${{ env.PYTEST_TIMEOUT_ARGS }}
      - name: Test report
        if: always()
        run: |
          [ -f integration-tests/report.json ] || (echo "FAIL: report.json not generated" && exit 1)
          poetry run shardctl test-report
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
          cp integration-tests/report.json /tmp/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-rust-test-custom
          path: /tmp/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl reset -y
          poetry run shardctl test-reset

  # ===========================================================
  # Iterative debug loop: exercises --keep-running + --skip-setup --session-id.
  # Phase 3 feature. Verifies that re-using an existing test session is
  # measurably faster than fresh shard bring-up, and that test-reset cleans up.
  # ===========================================================
  iterative-loop:
    name: "Iterative debug loop (--keep-running + --skip-setup)"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    env:
      F1R3FLY_NODE_IMAGE: f1r3flyindustries/f1r3fly-rust:dev
    steps:
      - uses: actions/checkout@v5
      - name: Reserve shard ports from the ephemeral range
        run: ./scripts/ci/reserve-shard-ports.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - name: Clone f1r3node-rust (defaults.conf for NodeConf)
        run: poetry run shardctl clone f1r3node-rust
      - run: poetry run shardctl pull f1r3node-rust
      - name: First run — keep-running, capture session_id
        id: keep_running
        run: |
          # Run with --keep-running and tee output so we can grep the session_id.
          OUTPUT=$(poetry run shardctl test --keep-running --pytest-args "integration-tests/test/tests/standalone/test_heartbeat.py::test_heartbeat_creates_blocks_when_idle" 2>&1 | tee /dev/stderr)
          # The cleanup_registry fixture logs: "Session <id> started with --keep-running. To reuse this shard: pytest --skip-setup --session-id <id>"
          SID=$(echo "$OUTPUT" | grep -oE "session-id [a-f0-9]{8}" | head -1 | awk '{print $2}')
          [ -n "$SID" ] || (echo "FAIL: could not parse session_id from --keep-running output" && exit 1)
          echo "session_id=$SID" >> $GITHUB_OUTPUT
          echo "Captured session_id: $SID"
      - name: Verify session containers still running
        run: |
          SID="${{ steps.keep_running.outputs.session_id }}"
          docker ps --filter "name=rnode.test.${SID}" --format '{{.Names}}'
          COUNT=$(docker ps --filter "name=rnode.test.${SID}" --format '{{.Names}}' | wc -l | tr -d ' ')
          [ "$COUNT" -ge 1 ] || (echo "FAIL: expected at least 1 container for session ${SID}, got $COUNT" && exit 1)
      - name: Second run — skip-setup, adopt session, must be fast
        run: |
          SID="${{ steps.keep_running.outputs.session_id }}"
          START=$(date +%s)
          poetry run shardctl test --skip-setup --session-id "$SID" --pytest-args "integration-tests/test/tests/standalone/test_heartbeat.py::test_heartbeat_creates_blocks_when_idle"
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "Adopted-session run took ${ELAPSED}s"
          # Adopted runs skip ~60s of shard bring-up. Allow generous CI overhead.
          [ "$ELAPSED" -lt 60 ] || (echo "FAIL: adopted run took ${ELAPSED}s, expected < 60s (no bring-up cost)" && exit 1)
      - name: Negative case — --skip-setup without --session-id surfaces UsageError
        run: |
          if poetry run shardctl test --skip-setup --pytest-args "integration-tests/test/tests/standalone/test_heartbeat.py::test_heartbeat_creates_blocks_when_idle" 2>&1 | grep -qE "ERROR.*--skip-setup requires --session-id"; then
            echo "PASS: missing --session-id surfaces clear error"
          else
            echo "FAIL: expected error mentioning --skip-setup requires --session-id"
            exit 1
          fi
      - name: Negative case — invalid --session-id surfaces ValueError
        run: |
          if poetry run shardctl test --skip-setup --session-id deadbeef --pytest-args "integration-tests/test/tests/standalone/test_heartbeat.py::test_heartbeat_creates_blocks_when_idle" 2>&1 | grep -q "no running containers found.*deadbeef"; then
            echo "PASS: invalid session_id surfaces clear error"
          else
            echo "FAIL: expected ValueError mentioning the bad session_id"
            exit 1
          fi
      - name: test-reset removes the kept-alive shard
        run: |
          SID="${{ steps.keep_running.outputs.session_id }}"
          poetry run shardctl test-reset
          REMAIN=$(docker ps -a --filter "name=rnode.test.${SID}" --format '{{.Names}}' | wc -l | tr -d ' ')
          [ "$REMAIN" -eq 0 ] || (echo "FAIL: test-reset left ${REMAIN} container(s) for session ${SID}" && exit 1)
          echo "PASS: test-reset cleaned up session ${SID}"
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          docker ps -a > /tmp/logs/containers.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=rnode" 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "/tmp/logs/${name}.log" 2>&1 || true
          done
          cp integration-tests/report.json /tmp/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-iterative-loop
          path: /tmp/logs/
          retention-days: 7
      - name: Final cleanup
        if: always()
        run: |
          poetry run shardctl reset -y
          poetry run shardctl test-reset

