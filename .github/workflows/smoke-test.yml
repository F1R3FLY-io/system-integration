  rust-integration:
    name: Rust Integration Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install poetry
          poetry install --with integration
      - run: docker pull f1r3flyindustries/f1r3fly-rust-node:latest
      - name: "test_web_api (shard)"
        run: poetry run shardctl test --rust test_web_api --pytest-args "--timeout=600"
      - name: "test_heartbeat (standalone)"
        run: poetry run shardctl test --rust test_heartbeat_creates_block --pytest-args "--timeout=600"
      - name: "test_synchrony_constraint (custom)"
        run: poetry run shardctl test --rust test_synchrony_constraint --pytest-args "--timeout=600"
      - name: Cleanup
        if: always()
        run: |
          poetry run shardctl reset -y || true
          poetry run shardctl test-reset || true

  scala-integration:
