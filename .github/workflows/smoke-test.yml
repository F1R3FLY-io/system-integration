      - name: Wait for 25 blocks
        run: |
          TARGET=${{ env.BLOCK_TARGET }}
          for i in $(seq 1 120); do
            BLOCK_COUNT=$(curl -sf http://localhost:40403/api/blocks/1000 2>/dev/null | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            echo "  [$((i*5))s] blocks: $BLOCK_COUNT"
            if [ "$BLOCK_COUNT" -ge "$TARGET" ] 2>/dev/null; then
