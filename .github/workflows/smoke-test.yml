  monitoring-scala-shard:
    # Unstable on 2-core/7GB GitHub runners (f1r3node#452).
    name: "Monitoring: Scala Shard"
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
